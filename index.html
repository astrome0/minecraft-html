  explosion(x, y, z, power) {
    // white flash core
    this.spawn({ x, y, z, life: 0.22, size: power * 0.9, tex: 'white', fullBright: true, shrink: false, r: 1, g: 0.98, b: 0.9, drag: 1 });
    for (let i = 0; i < 8 * power; i++) {
      const a = Math.random() * Math.PI * 2, b2 = Math.random() * Math.PI - Math.PI / 2, m = Math.random() * power * 1.5;
      this.spawn({
        x: x + (Math.random() - 0.5) * power, y: y + (Math.random() - 0.5) * power, z: z + (Math.random() - 0.5) * power,
        vx: Math.cos(a) * Math.cos(b2) * m, vy: Math.sin(b2) * m + 1, vz: Math.sin(a) * Math.cos(b2) * m,
        life: 0.9 + Math.random() * 0.9, size: 0.3 + Math.random() * 0.25,
        tex: 'smoke_' + ((Math.random() * 4) | 0), grav: -0.4, drag: 0.9,
        r: 0.85, g: 0.82, b: 0.8,
      });
    }
  },
  update(dt, world) {
    const L = this.list;
    for (let i = L.length - 1; i >= 0; i--) {
      const p = L[i];
      p.age += dt;
      if (p.age >= p.life) { L.splice(i, 1); continue; }
      if (p.type === 'portal') {
        // spiral toward target
        const t = p.age / p.life;
        p.x = lerp(p.x, p.tx, t * 0.06); p.y = lerp(p.y, p.ty, t * 0.06); p.z = lerp(p.z, p.tz, t * 0.06);
        continue;
      }
      p.vy -= p.grav * dt;
      p.vx *= Math.pow(p.drag, dt * 60); p.vy *= Math.pow(p.drag, dt * 60); p.vz *= Math.pow(p.drag, dt * 60);
      const nx = p.x + p.vx * dt, ny = p.y + p.vy * dt, nz = p.z + p.vz * dt;
      // crude ground collision for gravity particles
      if (p.grav > 0 && world) {
        const bid = world.getBlock(floor(nx), floor(ny), floor(nz));
        if (Blocks[bid] && Blocks[bid].solid) {
          p.vx *= 0.4; p.vz *= 0.4;
          if (p.vy < 0) p.vy = 0;
        } else { p.x = nx; p.y = ny; p.z = nz; }
      } else { p.x = nx; p.y = ny; p.z = nz; }
      if (p.type === 'bubble' && world) {
        if (world.getBlock(floor(p.x), floor(p.y), floor(p.z)) !== B.WATER) { L.splice(i, 1); }
      }
    }
  },
  draw(world) {
    const L = this.list;
    if (!L.length) return;
    const R = Renderer;
    const yaw = R.camYaw, pitch = R.camPitch;
    // camera right/up vectors
    const rx = Math.cos(yaw), rz = Math.sin(yaw);
    const ux = Math.sin(yaw) * Math.sin(pitch), uy = Math.cos(pitch), uz = -Math.cos(yaw) * Math.sin(pitch);
    const V = [], I = [];
    for (const p of L) {
      let sz = p.size;
      if (p.shrink) sz *= 1 - (p.age / p.life) * 0.6;
      const slot = Tex.uv(p.tex);
      const tx = (slot % 32) * 16, ty = ((slot / 32) | 0) * 16;
      let u0, v0, u1, v1;
      if (p.u0 !== undefined && p.us < 16) {
        u0 = (tx + p.u0) / 512; v0 = (ty + p.v0) / 512;
        u1 = u0 + p.us / 512; v1 = v0 + p.us / 512;
      } else {
        u0 = tx / 512; v0 = ty / 512; u1 = (tx + 16) / 512; v1 = (ty + 16) / 512;
      }
      let sky = 1, blk = 0;
      if (world && !p.fullBright) {
        const l = world.getLightPacked(floor(p.x), floor(p.y), floor(p.z));
        sky = (l >> 4) / 15; blk = (l & 15) / 15;
      } else if (p.fullBright) { sky = 1; blk = 1; }
      const fade = p.age / p.life > 0.75 ? 1 - (p.age / p.life - 0.75) * 4 : 1;
      const base = V.length / 10;
      const corners = [
        [p.x - rx * sz - ux * sz, p.y - uy * sz, p.z - rz * sz - uz * sz, u0, v1],
        [p.x + rx * sz - ux * sz, p.y - uy * sz, p.z + rz * sz - uz * sz, u1, v1],
        [p.x + rx * sz + ux * sz, p.y + uy * sz, p.z + rz * sz + uz * sz, u1, v0],
        [p.x - rx * sz + ux * sz, p.y + uy * sz, p.z - rz * sz + uz * sz, u0, v0],
      ];
      for (const c of corners) V.push(c[0], c[1], c[2], c[3], c[4], p.r * fade, p.g * fade, p.b * fade, sky, blk);
      I.push(base, base + 1, base + 2, base, base + 2, base + 3);
    }
    R.drawDynamic(V, I, R.atlasTex, { blend: true, noCull: true });
  },
};

// ==== weather.js ====
'use strict';
// ============ weather.js — rain, snow, thunderstorms + lightning ============
// Only the overworld has weather. Rain falls as snow in cold biomes. Thunderstorms
// darken the sky (mobs spawn in daytime like vanilla) and spew random lightning.

const Weather = {
  state: 'clear',   // clear | rain | thunder
  timer: 600,       // seconds until the weather rolls over on its own
  rain: 0,          // smoothed 0..1 intensity used for visuals + audio
  target: 0,        // intensity the current state is heading toward
  flash: 0,         // lightning screen flash, 0..1, decays fast
  strikeCd: 6,      // seconds until the next lightning attempt (thunder only)
  snowing: false,   // true when the player's biome turns rain into snow
  drops: [],        // pool of falling particles {x,y,z,vy,vx,vz}
  bolts: [],        // active lightning bolts {x,y0,y1,t}
  MAX: 340,
  R: 15,            // radius of the rain volume around the player
  ambSrc: null, ambGain: null,

  reset() {
    this.state = 'clear'; this.rain = 0; this.target = 0; this.flash = 0;
    this.timer = 300 + Math.random() * 600;
    this.strikeCd = 6; this.drops.length = 0; this.bolts.length = 0;
    this.stopAmbient();
  },
  // vanilla /weather: clear can run for a long time, storms for a few minutes
  set(state, durationSec) {
    if (state !== 'clear' && state !== 'rain' && state !== 'thunder') return false;
    this.state = state;
    this.target = state === 'clear' ? 0 : state === 'rain' ? 0.85 : 1;
    if (durationSec === undefined || isNaN(durationSec)) {
      durationSec = state === 'clear' ? 300 + Math.random() * 8100 : 180 + Math.random() * 600;
    }
    this.timer = durationSec;
    if (state === 'thunder') this.strikeCd = 2 + Math.random() * 4;
    return true;
  },

  coldAt(world, x, z) {
    if (!world || world.dim !== 'overworld') return false;
    const b = Gen.biomeAt(floor(x), floor(z));
    return !!(b && (b.snowy || b === BIOMES.taiga));
  },

  update(dt, game) {
    const world = game.world;
    const overworld = world && world.dim === 'overworld';
    // roll the weather over when the timer runs out (skip in other dims)
    if (overworld) {
      this.timer -= dt;
      if (this.timer <= 0) {
        // clear ⇄ rain, with the odd rain → thunder
        if (this.state === 'clear') this.set(Math.random() < 0.25 ? 'thunder' : 'rain');
        else this.set('clear');
      }
    }
    // intensity eases toward the target; forced to 0 outside the overworld
    const goal = overworld ? this.target : 0;
    this.rain += (goal - this.rain) * Math.min(1, dt * 0.6);
    if (this.rain < 0.002) this.rain = 0;
    if (this.flash > 0) this.flash = Math.max(0, this.flash - dt * 3.2);

    const p = game.player;
    if (!p) return;
    this.snowing = this.coldAt(world, p.x, p.z);

    // rain ambience tracks intensity (and mutes underwater / when paused-clear)
    this.updateAmbient(game);

    if (this.rain <= 0 || !overworld) { if (this.drops.length) this.drops.length = 0; return; }

    // maintain the falling-drop pool around the player
    const want = Math.round(this.MAX * this.rain);
    while (this.drops.length < want) this.drops.push(this.newDrop(p, true));
    if (this.drops.length > want) this.drops.length = want;
    const fall = this.snowing ? 5 : 22;
    for (const d of this.drops) {
      d.y -= (d.vy || fall) * dt;
      if (this.snowing) { d.x += d.vx * dt; d.z += d.vz * dt; }
      if (d.y < p.y - 7) Object.assign(d, this.newDrop(p, false));
    }

    // thunderstorm lightning
    if (this.state === 'thunder' && this.rain > 0.6) {
      this.strikeCd -= dt;
      if (this.strikeCd <= 0) {
        this.strikeCd = 3 + Math.random() * 9;
        this.strike(game);
      }
    }
    for (let i = this.bolts.length - 1; i >= 0; i--) {
      this.bolts[i].t -= dt;
      if (this.bolts[i].t <= 0) this.bolts.splice(i, 1);
    }
  },
  newDrop(p, spread) {
    const a = Math.random() * Math.PI * 2, r = Math.sqrt(Math.random()) * this.R;
    return {
      x: p.x + Math.cos(a) * r,
      z: p.z + Math.sin(a) * r,
      y: p.y + 7 + Math.random() * (spread ? 12 : 4),
      vy: this.snowing ? 4 + Math.random() * 3 : 20 + Math.random() * 10,
      vx: this.snowing ? (Math.random() - 0.5) * 1.2 : 0,
      vz: this.snowing ? (Math.random() - 0.5) * 1.2 : 0,
    };
  },

  strike(game) {
    const w = game.world, p = game.player;
    const a = Math.random() * Math.PI * 2, r = 6 + Math.random() * 50;
    const x = floor(p.x + Math.cos(a) * r), z = floor(p.z + Math.sin(a) * r);
    if (!w.isLoaded(x, z)) return;
    // find the top solid block open to the sky
    let gy = -1;
    for (let y = 124; y > 1; y--) {
      const d = Blocks[w.getBlock(x, y, z)];
      if (d && d.solid && d.model === 'cube') { gy = y + 1; break; }
    }
    if (gy < 0 || w.getSky(x, gy, z) < 12) return; // roofed spots don't get hit
    this.bolts.push({ x: x + 0.5, z: z + 0.5, y0: gy, y1: gy + 30, t: 0.4 });
    this.flash = 1;
    Sfx.play('thunder', { pos: [x + 0.5, gy, z + 0.5], vol: 1 });
    Particles.burst('flame', x + 0.5, gy + 0.2, z + 0.5, 6, 0.4);
    Particles.burst('smoke', x + 0.5, gy + 0.5, z + 0.5, 5, 0.3);
    // small fire where it lands
    if (w.getBlock(x, gy, z) === B.AIR && Math.random() < 0.5) {
      w.setBlock(x, gy, z, B.FIRE); w.scheduleTick(x, gy, z, 30);
    }
    // shock nearby entities + the player
    for (const e of w.entities) {
      if (e.dead || e.type === 'item' || e.type === 'xp') continue;
      if (Math.hypot(e.x - (x + 0.5), e.z - (z + 0.5)) < 2.4 && Math.abs(e.y - gy) < 4) {
        e.takeDamage(5, { x: e.x, y: e.y, z: e.z, knock: 0 }); e.fireT = Math.max(e.fireT, 5);
      }
    }
    if (Math.hypot(p.x - (x + 0.5), p.z - (z + 0.5)) < 2.4 && Math.abs(p.y - gy) < 4) {
      p.takeDamage(5, null, true); p.fireT = Math.max(p.fireT, 5);
    }
  },

  // darken the sky / shorten fog while it rains; brighten hard on a lightning flash
  applyEnv(e, game) {
    if (e.dim !== 'overworld' || this.rain <= 0) {
      if (this.flash > 0 && e.dim === 'overworld') this.applyFlash(e, game);
      return;
    }
    const r = this.rain;
    const grey = [0.20, 0.22, 0.25];
    for (const k of ['skyTop', 'skyHorizon', 'fogColor']) {
      e[k][0] = lerp(e[k][0], grey[0] * e.dayLight, r * 0.75);
      e[k][1] = lerp(e[k][1], grey[1] * e.dayLight, r * 0.75);
      e[k][2] = lerp(e[k][2], grey[2] * e.dayLight, r * 0.75);
    }
    e.sunset *= 1 - r; e.starAlpha *= 1 - r;
    e.dayLight *= 1 - 0.28 * r;
    e.fogEnd *= 1 - 0.45 * r; e.fogStart *= 1 - 0.35 * r;
    this.applyFlash(e, game);
    game.dayLight = e.dayLight; // so daytime thunderstorms let mobs spawn (vanilla)
  },
  applyFlash(e, game) {
    if (this.flash <= 0) return;
    const f = this.flash * 0.8;
    for (const k of ['skyTop', 'skyHorizon', 'fogColor']) {
      e[k][0] = lerp(e[k][0], 1, f); e[k][1] = lerp(e[k][1], 1, f); e[k][2] = lerp(e[k][2], 1, f);
    }
    e.dayLight = Math.min(1, e.dayLight + f * 0.5);
    game.dayLight = e.dayLight;
  },

  draw(world) {
    if ((this.rain <= 0 || !this.drops.length) && !this.bolts.length) return;
    const R = Renderer, gl = R.gl;
    if (this.drops.length && world && world.dim === 'overworld') {
      const yaw = R.camYaw;
      const rx = Math.cos(yaw), rz = Math.sin(yaw); // camera-right (horizontal billboard)
      const snow = this.snowing;
      const tex = snow ? 'snow_p' : 'rain_p';
      const [u0v, v0v] = Mesher.uvRect(tex);
      const u0 = u0v, v0 = v0v, u1 = u0v + 16 / 512, v1 = v0v + 16 / 512;
      const hw = snow ? 0.06 : 0.05, hh = snow ? 0.06 : 0.45;
      const litLevel = clamp(Renderer.env.dayLight * 0.9 + 0.1, 0.35, 1);
      const V = [], I = [];
      for (const d of this.drops) {
        const bx = floor(d.x), by = floor(d.y), bz = floor(d.z);
        if (world.getSky(bx, by, bz) < 4) continue;         // sheltered: no rain
        const bd = Blocks[world.getBlock(bx, by, bz)];
        if (bd && bd.opaque) continue;                       // inside a block
        const base = V.length / 10;
        const x = d.x, y = d.y, z = d.z;
        V.push(
          x - rx * hw, y - hh, z - rz * hw, u0, v1, 1, 1, 1, litLevel, 0,
          x + rx * hw, y - hh, z + rz * hw, u1, v1, 1, 1, 1, litLevel, 0,
          x + rx * hw, y + hh, z + rz * hw, u1, v0, 1, 1, 1, litLevel, 0,
          x - rx * hw, y + hh, z - rz * hw, u0, v0, 1, 1, 1, litLevel, 0);
        I.push(base, base + 1, base + 2, base, base + 2, base + 3);
      }
      if (I.length) R.drawDynamic(V, I, R.atlasTex, { blend: true, noCull: true, light: [litLevel, 0] });
    }
    // lightning bolts (bright crossed beams, fading out)
    for (const b of this.bolts) {
      const a = clamp(b.t / 0.4, 0, 1);
      R.drawBeam(b.x, b.y0, b.z, b.x, b.y1, b.z, [1, 1, a]);
    }
  },

  // ---------- rain ambience (looping filtered noise) ----------
  updateAmbient(game) {
    const wantVol = (game.world && game.world.dim === 'overworld' && !(game.player && game.player.inWaterView))
      ? this.rain * (this.state === 'thunder' ? 0.16 : 0.11) : 0;
    if (wantVol > 0.001) {
      if (!this.ambSrc && Sfx.started) this.startAmbient();
      if (this.ambGain) this.ambGain.gain.setTargetAtTime(wantVol, Sfx.ctx.currentTime, 0.4);
    } else if (this.ambGain) {
      this.ambGain.gain.setTargetAtTime(0, Sfx.ctx.currentTime, 0.5);
    }
  },
  startAmbient() {
    try {
      const c = Sfx.ctx;
      const src = c.createBufferSource();
      src.buffer = Sfx.noiseBuf; src.loop = true;
      const flt = c.createBiquadFilter(); flt.type = 'lowpass'; flt.frequency.value = 2200; flt.Q.value = 0.4;
      const g = c.createGain(); g.gain.value = 0;
      src.connect(flt); flt.connect(g); g.connect(Sfx.sfxBus);
      src.start();
      this.ambSrc = src; this.ambGain = g;
    } catch (e) {}
  },
  stopAmbient() {
    try { if (this.ambSrc) this.ambSrc.stop(); } catch (e) {}
    this.ambSrc = null; this.ambGain = null;
  },
};

// ---------- rails & rideables (boats, minecarts) ----------
// rail shape → the two horizontal connection directions [dx,dz]
function railConnections(shape) {
  switch (shape) {
    case 0: case 4: case 5: return [[0, -1], [0, 1]]; // north-south (+ N/S slopes)
    case 1: case 2: case 3: return [[-1, 0], [1, 0]]; // east-west (+ E/W slopes)
    case 6: return [[0, 1], [1, 0]];   // curve SE
    case 7: return [[0, 1], [-1, 0]];  // curve SW
    case 8: return [[0, -1], [-1, 0]]; // curve NW
    case 9: return [[0, -1], [1, 0]];  // curve NE
  }

}
// pick a rail shape that best connects to neighbouring rails (incl. one-up slopes)
function computeRailShape(w, x, y, z) {
  const nb = {};
  for (const [k, dx, dz] of [['n', 0, -1], ['s', 0, 1], ['w', -1, 0], ['e', 1, 0]]) {
    if (w.getBlock(x + dx, y, z + dz) === B.RAIL) nb[k] = 'same';
    else if (w.getBlock(x + dx, y + 1, z + dz) === B.RAIL) nb[k] = 'up';
    else if (w.getBlock(x + dx, y - 1, z + dz) === B.RAIL) nb[k] = 'down';
  }
  const has = k => nb[k] !== undefined;
  // rising toward a higher neighbour becomes a slope
  for (const k of ['e', 'w', 'n', 's']) if (nb[k] === 'up') return { e: 2, w: 3, n: 4, s: 5 }[k];
  // straights first, then curves, then single stubs
  if (has('n') && has('s')) return 0;
  if (has('e') && has('w')) return 1;
  if (has('s') && has('e')) return 6;
  if (has('s') && has('w')) return 7;
  if (has('n') && has('w')) return 8;
  if (has('n') && has('e')) return 9;
  if (has('n') || has('s')) return 0;
  if (has('e') || has('w')) return 1;
  return 0;
}
// which direction a sloped rail rises toward, or null for flat rails
function railSlope(shape) {

}

    if (railAt(w, x + dx, y, z + dz) || railAt(w, x + dx, y + 1, z + dz) || railAt(w, x + dx, y - 1, z + dz)) n++;

  if (has(-1, 0) && has(1, 0)) return 1;
  if (has(0, 1) && has(1, 0)) return 6;
  if (has(0, 1) && has(-1, 0)) return 7;

// re-point a neighbour toward (dx,dz) only if it has a free slot (committed rails stay put)
function refitRailNeighbour(w, nx, ny, nz, dx, dz) {
  if (!railAt(w, nx, ny, nz)) return;
  const shape = w.getData(nx, ny, nz);
  if (railSlope(shape)) return;                     // don't disturb slopes
  if (railPointsToward(w, nx, ny, nz, dx, dz)) return; // already connects to us
  if (railRealConnCount(w, nx, ny, nz) >= 2) return;   // committed — locked
  let keep = null;

    else if (railAt(w, x + dx, y - 1, z + dz)) { ny = y - 1; level = 'down'; }
    if (level === null) continue;
    const already = railPointsToward(w, x + dx, ny, z + dz, -dx, -dz);

  }
  avail.sort((a, b) => (b.already ? 1 : 0) - (a.already ? 1 : 0));

    Particles.burst('poof', this.x, this.y + 0.2, this.z, 7);
    this.remove();
  }
  dropItem() {}
  ridersUiOpen() { return (typeof UI !== 'undefined' && UI.screen !== 'none') || (typeof Chat !== 'undefined' && Chat.open); }
}

class Boat extends Rideable {
  constructor(world, x, y, z) {
    super(world, x, y, z);
    this.type = 'boat';
    this.w = 1.3; this.h = 0.55; this.seatOff = 0.25;
  }
  dropItem() { spawnItemEntity(this.world, this.x, this.y + 0.2, this.z, mkStack('boat', 1), true); }
  update(dt, game) {
    const rider = this.rider && game.world === this.world ? this.rider : null;
    this.updateFluids();
    // steer toward the WASD direction relative to where the player is looking (free camera)
    if (rider && !this.ridersUiOpen()) {
      const K = rider.keys;
      let ax = 0, az = 0;
      if (K.fwd) az -= 1; if (K.back) az += 1; if (K.left) ax -= 1; if (K.right) ax += 1;
      if (ax || az) {
        const sy = Math.sin(rider.yaw), cy = Math.cos(rider.yaw);
        let wx = ax * cy - az * sy, wz = ax * sy + az * cy;
        const len = Math.hypot(wx, wz) || 1; wx /= len; wz /= len;
        const a = this.inWater ? 11 : 3.5;
        this.vx += wx * a * dt; this.vz += wz * a * dt;
      }
    }
    // buoyancy: bob up to the surface, otherwise fall
    if (this.inWater) { this.vy += 26 * dt; this.vy *= Math.pow(0.4, dt * 6); }
    else this.vy -= this.gravity * dt;
    const drag = this.inWater ? Math.pow(0.32, dt) : Math.pow(0.02, dt);
    this.vx *= drag; this.vz *= drag;
    const sp = Math.hypot(this.vx, this.vz), max = 7.5;
    if (sp > max) { this.vx = this.vx / sp * max; this.vz = this.vz / sp * max; }
    this.move(dt);
    if (this.y < -20) { this.die(); return; }
    // turn the hull to face travel (smoothly)
    if (sp > 0.4) {
      const target = Math.atan2(this.vx, -this.vz);
      let d = target - this.yaw;
      while (d > Math.PI) d -= Math.PI * 2;
      while (d < -Math.PI) d += Math.PI * 2;
      this.yaw += d * Math.min(1, dt * 6);
    }
    if (rider) this.placeRider();
  }
}

class Minecart extends Rideable {
  constructor(world, x, y, z) {
    super(world, x, y, z);
    this.type = 'minecart';
    this.w = 0.98; this.h = 0.7; this.seatOff = 0.4;
  }
  dropItem() { spawnItemEntity(this.world, this.x, this.y + 0.2, this.z, mkStack('minecart', 1), true); }
  findRail() {
    const bx = floor(this.x), bz = floor(this.z);
    for (const dy of [0, -1, 1]) {
      const yy = floor(this.y) + dy;
      if (this.world.getBlock(bx, yy, bz) === B.RAIL) return { x: bx, y: yy, z: bz, shape: this.world.getData(bx, yy, bz) };
    }
    return null;
  }
  update(dt, game) {
    const rider = this.rider && game.world === this.world ? this.rider : null;
    const rail = this.findRail();
    if (!rail) {
      // off the tracks: roll to a stop like a heavy loose entity
      this.gravity = 22;
      this.vx *= Math.pow(0.15, dt); this.vz *= Math.pow(0.15, dt);
      this.physics(dt);
      if (rider) this.placeRider();
      return;
    }
    const { x: rx, y: ry, z: rz, shape } = rail;
    const cx = rx + 0.5, cz = rz + 0.5;
    const cons = railConnections(shape);
    const slope = railSlope(shape);
    let sp = Math.hypot(this.vx, this.vz);
    let hx, hz;
    if (sp < 1e-3) { hx = cons[0][0]; hz = cons[0][1]; } else { hx = this.vx / sp; hz = this.vz / sp; }
    // entry = connection the cart came from; exit = the other one (this is what turns curves)
    let entry = cons[0], ed = -9;
    for (const c of cons) { const d = -(c[0] * hx + c[1] * hz); if (d > ed) { ed = d; entry = c; } }
    let exit = cons[0];
    for (const c of cons) if (c !== entry) { exit = c; break; }
    const dirx = exit[0], dirz = exit[1];
    if (rider && !this.ridersUiOpen()) {
      const K = rider.keys;
      if (K.fwd) sp += 9 * dt;   // self-propel (no powered rails in this build)
      if (K.back) sp -= 12 * dt;
    }
    if (slope) { const up = (dirx === slope[0] && dirz === slope[1]); sp += (up ? -7 : 7) * dt; }
    sp *= Math.pow(rider ? 0.78 : 0.5, dt); // rolling friction (empty carts stop sooner)
    sp = clamp(sp, 0, 8);
    this.vx = dirx * sp; this.vz = dirz * sp;
    this.x += this.vx * dt; this.z += this.vz * dt;
    if (dirx !== 0) this.z = cz; else this.x = cx; // stay on the centerline
    let yy = ry + 0.14;
    if (slope) {
      const t = slope[0] !== 0 ? (this.x - rx) : (this.z - rz);
      const frac = (slope[0] > 0 || slope[1] > 0) ? t : 1 - t;
      yy = ry + 0.14 + clamp(frac, 0, 1);
    }
    this.y = yy;
    if (sp > 0.05) this.yaw = Math.atan2(dirx, -dirz);
    if (rider) this.placeRider();
  }
}

// ---------- spawn helpers ----------
const MOB_CLASSES = {
  pig: Pig, cow: Cow, sheep: Sheep, chicken: Chicken, villager: Villager,
  zombie: Zombie, skeleton: Skeleton, creeper: Creeper, spider: Spider,
  enderman: Enderman, blaze: Blaze, ghast: Ghast, pigman: ZombiePigman,
  end_crystal: EndCrystal, dragon: EnderDragon,
};
function spawnMob(world, type, x, y, z) {
  const C = MOB_CLASSES[type];
  if (!C) return null;
  const e = new C(world, x, y, z);
  world.entities.push(e);
  return e;
}
function spawnItemEntity(world, x, y, z, stack, scatter) {
  const e = new ItemEntity(world, x, y, z, stack, scatter);
  world.entities.push(e);
  return e;
}
function spawnXPOrbs(world, x, y, z, amount) {
  // split into orbs
  const sizes = [50, 20, 10, 5, 2, 1];
  let left = amount, guard = 0;
  while (left > 0 && guard++ < 60) {
    let v = 1;
    for (const s of sizes) if (s <= left) { v = s; break; }
    left -= v;
    world.entities.push(new XPOrb(world, x, y, z, v));
  }
}
function spawnFallingBlock(world, x, y, z, id, data) {
  world.entities.push(new FallingBlock(world, x, y, z, id, data));
}
function spawnPrimedTNT(world, x, y, z, fuse) {
  const e = new PrimedTNT(world, x, y, z, fuse);
  world.entities.push(e);
  Sfx.play('fuse', { pos: [x, y, z] });
  return e;
}

// ---------- natural spawning ----------
const NaturalSpawner = {
  t: 0,
  update(world, game, dt) {
    this.t -= dt;
    if (this.t > 0) return;
    this.t = 1.5;
    const p = game.player;
    let hostiles = 0, passives = 0;
    for (const e of world.entities) {
      if (e.dead) continue;
      if (e instanceof HostileMob) hostiles++;
      else if (e instanceof PassiveMob) passives++;
      // despawn far hostiles
      if (e instanceof HostileMob && e.type !== 'blaze') {
        const d = Math.hypot(e.x - p.x, e.z - p.z);
        if (d > 110) e.remove();
      }
    }
    const cap = world.dim === 'end' ? 16 : 14;
    if (hostiles < cap) {
      for (let i = 0; i < 6; i++) {
        const a = Math.random() * Math.PI * 2;
        const d = 26 + Math.random() * 40;
        const x = p.x + Math.cos(a) * d, z = p.z + Math.sin(a) * d;
        if (!world.isLoaded(floor(x), floor(z))) continue;
        // find standable y
        const ys = [];
        for (let y = 1; y < 126; y++) {
          if (Blocks[world.getBlock(floor(x), y - 1, floor(z))].solid &&
              world.getBlock(floor(x), y, floor(z)) === B.AIR &&
              world.getBlock(floor(x), y + 1, floor(z)) === B.AIR) ys.push(y);
        }
        if (!ys.length) continue;
        const y = ys[(Math.random() * ys.length) | 0];
        if (world.dim === 'overworld') {
          const sky = world.getSky(floor(x), y, floor(z));
          const blk = world.getBlockLight(floor(x), y, floor(z));
          const effSky = sky * game.dayLight;
          if (blk >= 8 || effSky >= 7.5) continue;
          const r = Math.random();
          const type = r < 0.3 ? 'zombie' : r < 0.55 ? 'skeleton' : r < 0.78 ? 'creeper' : r < 0.93 ? 'spider' : 'enderman';
          spawnMob(world, type, x, y, z);
        } else if (world.dim === 'nether') {
          const r = Math.random();
          if (r < 0.55) {
            // pigman group
            for (let k = 0; k < 2 + ((Math.random() * 3) | 0); k++) spawnMob(world, 'pigman', x + Math.random() * 2 - 1, y, z + Math.random() * 2 - 1);
          } else if (r < 0.8) {
            if (y > 45) spawnMob(world, 'ghast', x, y + 6, z);
          } else {
            const f = Gen.nearestFortress(x, z);
            if (f && x > f.x0 && x < f.x1 && z > f.z0 && z < f.z1) spawnMob(world, 'blaze', x, y, z);
          }
        } else {
          spawnMob(world, 'enderman', x, y, z);
        }
        break;
      }
    }
    // passive spawns (rare, day, grass)
    if (world.dim === 'overworld' && passives < 10 && game.dayLight > 0.7 && Math.random() < 0.25) {
      const a = Math.random() * Math.PI * 2;
      const d = 28 + Math.random() * 30;
      const x = p.x + Math.cos(a) * d, z = p.z + Math.sin(a) * d;
      if (world.isLoaded(floor(x), floor(z))) {
        for (let y = 100; y > SEA; y--) {
          if (world.getBlock(floor(x), y, floor(z)) === B.GRASS && world.getBlock(floor(x), y + 1, floor(z)) === B.AIR) {
            spawnMob(world, ['pig', 'cow', 'sheep', 'chicken'][(Math.random() * 4) | 0], x, y + 1, z);
            break;
          }
        }
      }
    }
  },
};

// ---------- update & render all entities ----------
function updateEntities(world, dt, game) {
  // flush pending spawns from generation
  if (world.pendingSpawns.length) {
    for (const s of world.pendingSpawns) {
      if (s.type === 'dragon' || s.type === 'end_crystal') {
        if (game.dragonKilled && s.type === 'end_crystal') continue;
      }
      spawnMob(world, s.type, s.x, s.y, s.z);
    }
    world.pendingSpawns.length = 0;
  }
  const p = game.player;
  for (let i = world.entities.length - 1; i >= 0; i--) {
    const e = world.entities[i];
    if (e.dead) { world.entities.splice(i, 1); continue; }
    // skip far entities
    const d = Math.hypot(e.x - p.x, e.z - p.z);
    if (d > 140) { if (e.type === 'item' || e.type === 'xp') continue; }
    if (d < 130) e.tick(dt, game);
    if (e.dead) world.entities.splice(i, 1);
  }
  NaturalSpawner.update(world, game, dt);
}
function drawEntities(world, game, dt) {
  const R = Renderer;
  for (const e of world.entities) {
    if (e.dead) continue;
    const dx = e.x - R.camX, dz = e.z - R.camZ;
    if (dx * dx + dz * dz > 130 * 130) continue;
    if (!R.frustum.sphereVisible(e.x, e.y + e.h / 2, e.z, Math.max(e.w, e.h) + 2)) continue;
    const l = world.getLightPacked(floor(e.x), floor(clamp(e.y + e.h * 0.6, 0, 127)), floor(e.z));
    const light = [(l >> 4) / 15, (l & 15) / 15];
    if (e.type === 'item') {
      const it = Items[e.stack.id];
      const bob = Math.sin(e.age * 2.2) * 0.06 + 0.18;
      const m = Mat4.create();
      Mat4.translate(m, e.x, e.y + bob, e.z);
      Mat4.rotY(m, e.age * 1.1);
      if (it && it.block !== undefined && Blocks[it.block] && Blocks[it.block].model !== 'cross' && Blocks[it.block].model !== 'crop' && Blocks[it.block].model !== 'rail') {
        Mat4.scale(m, 0.25, 0.25, 0.25);
        Mat4.translate(m, 0, 0.5, 0);
        R.drawGeo(R.getMiniBlock(it.block), m, light, R.atlasTex);
      } else {
        const tex = it && it.icon ? it.icon : (it && it.block !== undefined ? (Blocks[it.block].tex.all || Blocks[it.block].tex.side) : 'missing');
        Mat4.scale(m, 0.36, 0.36, 0.36);
        Mat4.translate(m, 0, 0.5, 0);
        R.drawGeo(R.getSprite(tex), m, light, R.atlasTex);
      }
    } else if (e.type === 'xp') {
      const m = Mat4.create();
      Mat4.translate(m, e.x, e.y + 0.1 + Math.sin(e.age * 3) * 0.04, e.z);
      Mat4.rotY(m, Math.PI - R.camYaw);
      Mat4.scale(m, 0.24, 0.24, 0.24);
      Mat4.translate(m, 0, 0.5, 0);
      R.drawGeo(R.getSprite('xp_orb'), m, [light[0], 1], R.atlasTex);
    } else if (e.type === 'arrow') {
      const m = Mat4.create();
      Mat4.translate(m, e.x, e.y, e.z);
      Mat4.rotY(m, Math.PI - e.yaw);
      const pitch = Math.atan2(e.vy || 0, Math.hypot(e.vx, e.vz) || 1);
      Mat4.rotX(m, -pitch);
      Mat4.rotZ(m, Math.PI / 4);
      Mat4.scale(m, 0.5, 0.5, 0.5);
      R.drawGeo(R.getSprite('i_arrow'), m, light, R.atlasTex);
    } else if (e.type === 'pearl' || e.type === 'eye') {
      const m = Mat4.create();
      Mat4.translate(m, e.x, e.y, e.z);
      Mat4.rotY(m, Math.PI - R.camYaw);
      Mat4.scale(m, 0.3, 0.3, 0.3);
      R.drawGeo(R.getSprite(e.type === 'pearl' ? 'i_ender_pearl' : 'i_eye_of_ender'), m, [1, 1], R.atlasTex);
    } else if (e.type === 'blaze_fireball' || e.type === 'ghast_fireball') {
      const m = Mat4.create();
      Mat4.translate(m, e.x, e.y, e.z);
      Mat4.rotY(m, Math.PI - R.camYaw);
      const s = e.big ? 1 : 0.35;
      Mat4.scale(m, s, s, s);
      R.drawGeo(R.getSprite('flame_p'), m, [1, 1], R.atlasTex);
    } else if (e.type === 'tnt') {
      const m = Mat4.create();
      Mat4.translate(m, e.x, e.y + 0.49, e.z);
      const flash = (e.fuse % 0.5) < 0.25 ? 0 : 0.7;
      Mat4.scale(m, 0.98, 0.98, 0.98);
      R.drawGeo(R.getMiniBlock(B.TNT), m, light, R.atlasTex, flash);
    } else if (e.type === 'falling_block') {
      const m = Mat4.create();
      Mat4.translate(m, e.x, e.y + 0.49, e.z);
      R.drawGeo(R.getMiniBlock(e.blockId), m, light, R.atlasTex);
    } else if (e.type === 'boat') {
      const m = Mat4.create();
      Mat4.translate(m, e.x, e.y + 0.02, e.z);
      Mat4.rotY(m, e.yaw);
      R.drawGeo(R.getBoxModel('boat'), m, light, R.atlasTex, e.hurtT > 0.15 ? 0.8 : 0);
    } else if (e.type === 'minecart') {
      const m = Mat4.create();
      Mat4.translate(m, e.x, e.y + 0.05, e.z);
      Mat4.rotY(m, e.yaw);
      R.drawGeo(R.getBoxModel('minecart'), m, light, R.atlasTex, e.hurtT > 0.15 ? 0.8 : 0);
    } else if (MOB_MODELS[e.type]) {
      const model = MOB_MODELS[e.type];
      const poses = [];
      model.pose(e, poses);
      const hurt = e.hurtT > 0.3 || e.deathT > 0 ? 0.8 : 0;
      let elight = light;
      if (e.type === 'blaze' || e.type === 'end_crystal' || e.type === 'dragon') elight = [light[0], 1];
      R.drawMob(e, poses, elight, hurt);
      // crystal beam
      if (e.type === 'dragon' && e.healingCrystal) {
        R.drawBeam(e.healingCrystal.x, e.healingCrystal.y + 1.6, e.healingCrystal.z, e.x, e.y + 1.5, e.z, [1, 0.6, 0.9]);
      }
      if (e.type === 'dragon' && e.dying) {
        for (let i = 0; i < 7; i++) {
          const a = e.dieT * 0.7 + i * Math.PI * 2 / 7;
          R.drawBeam(e.x, e.y + 1.5, e.z, e.x + Math.cos(a) * 30, e.y + 10 + Math.sin(e.dieT + i) * 14, e.z + Math.sin(a) * 30, [1, 1, 1]);
        }
      }
    }
  }
}

// ==== player.js ====
'use strict';
// ============ player.js — movement, mining, interaction, survival stats ============

// muted key set used while a container UI or chat is open (no movement input)
const NO_KEYS = {};

// ---- hold-to-place / hold-to-break tuning (seconds between repeats while a button is held) ----
// Lower = faster/snappier. Set to 0 for effectively instant (every-frame) placing/breaking.
const USE_REPEAT = 0.3;            // placing blocks & using items while holding right-click
const CREATIVE_BREAK_REPEAT = 0.3; // breaking blocks while holding left-click in creative

class Inventory {
  constructor() {
    this.slots = new Array(36).fill(null); // 0-8 hotbar
    this.armor = new Array(4).fill(null);  // head chest legs feet
  }
  add(stack) {
    // merge into existing
    for (let i = 0; i < 36 && stack.n > 0; i++) {
      const s = this.slots[i];
      if (s && s.id === stack.id && !s.dur && !stack.dur && s.n < stackMax(s)) {
        const take = Math.min(stackMax(s) - s.n, stack.n);
        s.n += take; stack.n -= take;
      }
    }
    // empty slots (hotbar first)
    for (let i = 0; i < 36 && stack.n > 0; i++) {
      if (!this.slots[i]) {
        const take = Math.min(stackMax(stack), stack.n);
        this.slots[i] = { id: stack.id, n: take };
        if (stack.dur !== undefined) this.slots[i].dur = stack.dur;
        stack.n -= take;
      }
    }
    return stack.n;
  }
  countOf(id) {
    let n = 0;
    for (const s of this.slots) if (s && s.id === id) n += s.n;
    return n;
  }
  removeN(id, n) {
    for (let i = 0; i < 36 && n > 0; i++) {
      const s = this.slots[i];
      if (s && s.id === id) {
        const take = Math.min(s.n, n);
        s.n -= take; n -= take;
        if (s.n <= 0) this.slots[i] = null;
      }
    }
    return n === 0;
  }
  armorPoints() {
    let p = 0;
    for (const s of this.armor) if (s && Items[s.id] && Items[s.id].armor) p += Items[s.id].armor.pts;
    return p;
  }
  damageArmor() {
    for (let i = 0; i < 4; i++) {
      const s = this.armor[i];
      if (s && s.dur !== undefined) {
        s.dur--;
        if (s.dur <= 0) { this.armor[i] = null; Sfx.play('break'); }
      }
    }
  }
}

class Player {
  constructor(game) {
    this.game = game;
    this.x = 0; this.y = 80; this.z = 0;
    this.vx = 0; this.vy = 0; this.vz = 0;
    this.yaw = 0; this.pitch = 0;
    this.w = 0.6; this.h = 1.8;
    this.onGround = false;
    this.hp = 20; this.maxHp = 20;
    this.hunger = 20; this.saturation = 5; this.exhaustion = 0;
    this.air = 15;
    this.xp = 0; this.xpLevel = 0; this.xpProgress = 0;
    this.inventory = new Inventory();
    this.selected = 0;
    this.keys = {};
    this.sprinting = false; this.sneaking = false;
    this.fly = false;
    this.mining = null;
    this.swing = 1; // swing anim progress (1 = idle)
    this.swingLoop = false;
    this.eating = 0; this.eatItem = null;
    this.bowCharge = -1;
    this.fallStart = this.y;
    this.hurtFlash = 0;
    this.deadFlag = false;
    this.fireT = 0;
    this.regenT = 0; this.starveT = 0; this.regenEffect = 0; this.hungerEffect = 0;
    this.spawnX = 0; this.spawnY = 80; this.spawnZ = 0; this.bedSpawn = null;
    this.useCd = 0;
    this.bobT = 0; this.bobAmp = 0;
    this.eyeH = 1.62;
    this.lastDamage = 0;
    this.doubleTapW = 0;
    this.portalT = 0;
    this.riding = null; this.dismountCd = 0;
  }
  get world() { return this.game.world; }
  heldItem() { return this.inventory.slots[this.selected]; }
  lookDir() {
    // matches the render camera: forward = (sin yaw * cos p, -sin p, -cos yaw * cos p)
    const cp = Math.cos(this.pitch);
    return [Math.sin(this.yaw) * cp, -Math.sin(this.pitch), -Math.cos(this.yaw) * cp];
  }
  eyeY() { return this.y + this.eyeH; }
  // exact render-camera position incl. view bob — use for every aim raycast so
  // the crosshair, selection box and hits always agree with what's on screen
  eyePos() {
    let bx = 0, by = 0;
    if (this.game.options.bob && this.onGround) {
      by = Math.abs(Math.sin(this.bobT)) * 0.09 * this.bobAmp;
      bx = Math.sin(this.bobT) * 0.05 * this.bobAmp;
    }
    return [this.x + bx * Math.cos(this.yaw), this.y + this.eyeH + by, this.z + bx * Math.sin(this.yaw)];
  }
  aabb() { return { x: this.x, y: this.y, z: this.z, w: this.w, h: this.h }; }

  update(dt, game) {
    if (this.deadFlag) return;
    // riding a boat/minecart: the vehicle drives us and sets our position
    if (this.riding) {
      if (this.riding.dead || this.riding.world !== this.world) { this.riding.rider = null; this.riding = null; }
      else { this.updateRiding(dt, game); return; }
    }
    // freeze movement input while an inventory/container screen or chat is open
    const uiOpen = (typeof UI !== 'undefined' && UI.screen !== 'none') || (typeof Chat !== 'undefined' && Chat.open);
    const K = uiOpen ? NO_KEYS : this.keys;
    // sneaking / sprinting

  updateRiding(dt, game) {

  // ---------- mining ----------

    if (!hit) { this.mining = null; return; }
    const id = this.world.getBlock(hit.x, hit.y, hit.z);
    if (id === B.AIR) { this.mining = null; return; }
    const def = Blocks[id];
    // creative: instant break (even bedrock), short cooldown while holding
    if (this.game.mode === 'creative') {
      this.mining = null;
      this.swingLoop = true;
      if (this.swing >= 1) this.swingNow();
      this.creativeCd = (this.creativeCd || 0) - dt;
      if (this.creativeCd <= 0) {
        this.creativeCd = CREATIVE_BREAK_REPEAT;
        Particles.blockBreak(this.world, hit.x, hit.y, hit.z, id);
        Sfx.play('break_' + def.sound, { pos: [hit.x, hit.y, hit.z] });
        this.world.breakBlock(hit.x, hit.y, hit.z, null);
        this.game.onBlockMined(id, this.heldItem());
      }
      return;
    }
    if (def.hard < 0) { this.mining = null; this.swingLoop = true; this.swingNow(); return; }
    if (!this.mining || this.mining.x !== hit.x || this.mining.y !== hit.y || this.mining.z !== hit.z) {
      this.mining = { x: hit.x, y: hit.y, z: hit.z, progress: 0, soundT: 0 };
    }
    const m = this.mining;
    const time = blockBreakTime(id, this.heldItem());
    m.progress += dt / time;
    m.soundT -= dt;
    this.swingLoop = true;
    if (this.swing >= 1) this.swingNow();
    if (m.soundT <= 0) {

      Sfx.play('dig_' + def.sound, { pos: [hit.x, hit.y, hit.z], vol: 0.3, pitch: 0.75 });

      const bb = [e.x - e.w / 2 - 0.1, e.y - 0.1, e.z - e.w / 2 - 0.1, e.x + e.w / 2 + 0.1, e.y + e.h + 0.1, e.z + e.w / 2 + 0.1];

  // ---------- use (right click) ----------

    const it = Items[held.id];

  interactBlock(hit, id) {

        this.consumeHeld();
        Sfx.play('place_stone', { pos: [bx, by, bz] });
        this.useCd = USE_REPEAT; this.swingNow();

      return;
    }
    // buckets
    if (held.id === 'bucket') { this.tryFillBucket(); return; }
    if (held.id === 'water_bucket' || held.id === 'lava_bucket') {
      const fx = hit.x + FACE_N[hit.face][0], fy = hit.y + FACE_N[hit.face][1], fz = hit.z + FACE_N[hit.face][2];
      const tid = w.getBlock(fx, fy, fz);
      if (tid === B.AIR || w.canFluidReplace(tid) || tid === B.WATER || tid === B.LAVA) {
        w.setBlock(fx, fy, fz, held.id === 'water_bucket' ? B.WATER : B.LAVA, 0);
        w.scheduleTick(fx, fy, fz, 4);
        Sfx.play(held.id === 'water_bucket' ? 'splash' : 'lavaPop');
        this.inventory.slots[this.selected] = mkStack('bucket', 1);
        this.useCd = 0.3;

    }
    // block placement

  }
  tryFillBucket() {

      const bx = floor(px), by = floor(py), bz = floor(pz);
      const id = w.getBlock(bx, by, bz);
      if (id === B.WATER || id === B.LAVA) {
        const d = w.getData(bx, by, bz);
        if ((d & 15) === 0) { // source only
          w.setBlock(bx, by, bz, B.AIR);
          const held = this.heldItem();
          const filled = mkStack(id === B.WATER ? 'water_bucket' : 'lava_bucket', 1);
          if (held.n === 1) this.inventory.slots[this.selected] = filled;
          else { held.n--; if (this.inventory.add(filled) > 0) spawnItemEntity(w, this.x, this.y + 1, this.z, filled, true); }
          Sfx.play(id === B.WATER ? 'splash' : 'lavaPop');

      const id = w.getBlock(bx, by, bz);
      if (id === B.WATER) {

        Sfx.play('splash', { pos: [bx, by, bz] });
        return;
      }

  placeBlock(held, it, hit) {

    const replaceable = Blocks[targetId] && Blocks[targetId].replaceable;
    if (!replaceable) {
      px += FACE_N[hit.face][0]; py += FACE_N[hit.face][1]; pz += FACE_N[hit.face][2];
    }

    }

      w.setBlock(px, py + 1, pz, B.DOOR, 1 | (facing << 1));

    this.bowCharge = -1;
    if (charge < 0.12) return;
    const creative = this.game.mode === 'creative';
    if (!creative && !this.inventory.removeN('arrow', 1)) return;
    const dir = this.lookDir();
    const power = Math.min(1, charge);
    const crit = power >= 1 && Math.random() < 0.35;
    const dmg = Math.max(1, Math.round(2 + power * 6 + (crit ? 2 : 0)));
    this.world.entities.push(new Arrow(this.world, this.x + dir[0] * 0.4, this.eyeY() - 0.1, this.z + dir[2] * 0.4, dir[0], dir[1], dir[2], 14 + power * 32, dmg, true));
    Sfx.play('bowShoot', { pitch: 0.85 + power * 0.4 });
    const held = this.heldItem();
    if (!creative && held && held.dur !== undefined) {
      held.dur--;
      if (held.dur <= 0) { this.inventory.slots[this.selected] = null; Sfx.play('break'); }
    }
    this.addExhaustion(0.1);
  }
  dropSelected(all) {
    const s = this.inventory.slots[this.selected];
    if (!s) return;
    const dir = this.lookDir();
    const n = all ? s.n : 1;
    const drop = { id: s.id, n };
    if (s.dur !== undefined) drop.dur = s.dur;
    const e = spawnItemEntity(this.world, this.x + dir[0] * 0.5, this.eyeY() - 0.3, this.z + dir[2] * 0.5, drop, false);
    e.vx = dir[0] * 7; e.vy = dir[1] * 7 + 2; e.vz = dir[2] * 7;
    e.pickupDelay = 1.5;
    s.n -= n;
    if (s.n <= 0) this.inventory.slots[this.selected] = null;
    this.swingNow();
  }
}

'use strict';
// ============ sound.js — WebAudio synth SFX + music ============

const Sfx = {
  ctx: null, master: null, sfxBus: null, musicBus: null,
  noiseBuf: null,
  volSound: 1, volMusic: 0.6,
  started: false,

  ensure() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return true; }
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) { return false; }
    const c = this.ctx;
    this.master = c.createDynamicsCompressor();
    this.master.threshold.value = -12;
    this.master.ratio.value = 6;
    this.master.connect(c.destination);
    this.sfxBus = c.createGain(); this.sfxBus.gain.value = this.volSound; this.sfxBus.connect(this.master);
    this.musicBus = c.createGain(); this.musicBus.gain.value = this.volMusic * 0.5; this.musicBus.connect(this.master);
    // shared white noise buffer
    const len = c.sampleRate * 2;
    this.noiseBuf = c.createBuffer(1, len, c.sampleRate);
    const d = this.noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.started = true;
    return true;
  },
  setVolumes(sound, music) {
    this.volSound = sound; this.volMusic = music;
    if (this.sfxBus) this.sfxBus.gain.value = sound;
    if (this.musicBus) this.musicBus.gain.value = music * 0.5;
  },
  out(pos, vol) {
    // per-sound gain (+pan) node chain → sfxBus
    const c = this.ctx;
    const g = c.createGain();
    let v = vol;
    if (pos) {
      const dx = pos[0] - Renderer.camX, dy = (pos[1] || 0) - Renderer.camY, dz = pos[2] - Renderer.camZ;
      const d = Math.hypot(dx, dy, dz);
      if (d > 34) return null;
      v *= 1 / (1 + d * 0.14);
      if (c.createStereoPanner) {
        const pan = c.createStereoPanner();
        const yaw = Renderer.camYaw;
        const rx = Math.cos(yaw), rz = Math.sin(yaw);
        pan.pan.value = clamp((dx * rx + dz * rz) / Math.max(d, 0.001) * 0.7, -0.9, 0.9);
        g.connect(pan); pan.connect(this.sfxBus);
        g.gain.value = v;
        return g;
      }
    }
    g.gain.value = v;
    g.connect(this.sfxBus);
    return g;
  },
  tone(dest, { f = 440, f1, type = 'sine', t = 0, dur = 0.2, vol = 0.5, attack = 0.005, curve = 'exp', vib, vibF = 6 }) {
    const c = this.ctx;
    const o = c.createOscillator();
    o.type = type;
    const t0 = c.currentTime + t;
    o.frequency.setValueAtTime(f, t0);
    if (f1 !== undefined) o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), t0 + dur);
    if (vib) {
      const l = c.createOscillator(), lg = c.createGain();
      l.frequency.value = vibF; lg.gain.value = vib;
      l.connect(lg); lg.connect(o.frequency);
      l.start(t0); l.stop(t0 + dur + 0.05);
    }
    const g = c.createGain();
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + attack);
    if (curve === 'exp') g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    else g.gain.linearRampToValueAtTime(0, t0 + dur);
    o.connect(g); g.connect(dest);
    o.start(t0); o.stop(t0 + dur + 0.05);
  },
  noise(dest, { t = 0, dur = 0.15, vol = 0.5, type = 'bandpass', f = 800, f1, q = 1, attack = 0.003 }) {
    const c = this.ctx;
    const src = c.createBufferSource();
    src.buffer = this.noiseBuf;
    src.loop = true;
    src.playbackRate.value = 0.7 + Math.random() * 0.6;
    const flt = c.createBiquadFilter();
    flt.type = type;
    const t0 = c.currentTime + t;
    flt.frequency.setValueAtTime(f, t0);
    if (f1 !== undefined) flt.frequency.exponentialRampToValueAtTime(Math.max(f1, 20), t0 + dur);
    flt.Q.value = q;
    const g = c.createGain();
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + attack);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    src.connect(flt); flt.connect(g); g.connect(dest);
    src.start(t0); src.stop(t0 + dur + 0.05);
  },

  play(name, opts = {}) {
    if (!this.started && !this.ensure()) return;
    if (this.ctx.state === 'suspended') { this.ctx.resume(); }
    const vol = (opts.vol !== undefined ? opts.vol : 1);
    const pitch = opts.pitch || 1;
    let fn = this.defs[name];
    if (!fn && opts.fallback) fn = this.defs[opts.fallback];
    if (!fn) return;
    const dest = this.out(opts.pos, vol);
    if (!dest) return;
    try { fn.call(this, dest, pitch); } catch (e) {}
  },

// ---------- music ----------
const Music = {
  nextT: 8, playing: false, curNodes: [], fadeGain: null, currentKind: null,
  update(dt, game) {
    if (!Sfx.started || Sfx.volMusic <= 0.01) return;
    const kind = game.state === 'title' ? 'menu'
      : game.state === 'win' ? 'credits'
      : game.world && game.world.dim === 'nether' ? 'nether'
      : game.world && game.world.dim === 'end' ? 'end' : 'calm';
    if (this.playing) {
      if (kind !== this.currentKind && (kind === 'credits' || this.currentKind === 'menu' || kind === 'end' || kind === 'nether' || this.currentKind === 'end' || this.currentKind === 'nether')) this.stop();
      return;
    }
    this.nextT -= dt;
    if (this.nextT <= 0) {
      this.start(kind);
      this.nextT = 999;
    }
  },
  stop() {
    if (this.fadeGain && Sfx.ctx) {
      const g = this.fadeGain;
      g.gain.setTargetAtTime(0, Sfx.ctx.currentTime, 0.8);
      setTimeout(() => { try { g.disconnect(); } catch (e) {} }, 3000);
    }
    this.playing = false;
    this.currentKind = null;
    this.nextT = 30 + Math.random() * 60;
  },
  piano(dest, midi, t, dur, vel) {
    const c = Sfx.ctx;
    const f = 440 * Math.pow(2, (midi - 69) / 12);
    const t0 = c.currentTime + t;
    const g = c.createGain();
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(vel, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    const flt = c.createBiquadFilter();
    flt.type = 'lowpass'; flt.frequency.value = Math.min(f * 5, 6000);
    for (const [mult, amp, type] of [[1, 1, 'sine'], [2, 0.32, 'sine'], [3, 0.09, 'sine'], [1.001, 0.4, 'triangle']]) {
      const o = c.createOscillator();
      o.type = type; o.frequency.value = f * mult;
      const og = c.createGain(); og.gain.value = amp;
      o.connect(og); og.connect(flt);
      o.start(t0); o.stop(t0 + dur + 0.1);
    }
    flt.connect(g); g.connect(dest);
  },
  pad(dest, midi, t, dur, vel) {
    const c = Sfx.ctx;
    const f = 440 * Math.pow(2, (midi - 69) / 12);
    const t0 = c.currentTime + t;
    const g = c.createGain();
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(vel, t0 + dur * 0.35);
    g.gain.linearRampToValueAtTime(0, t0 + dur);
    for (const mult of [1, 1.503, 2.0]) {
      const o = c.createOscillator();
      o.type = 'triangle'; o.frequency.value = f * mult;
      const og = c.createGain(); og.gain.value = mult === 1 ? 0.6 : 0.18;
      o.connect(og); og.connect(g);
      o.start(t0); o.stop(t0 + dur + 0.1);
    }
    const flt = c.createBiquadFilter();
    flt.type = 'lowpass'; flt.frequency.value = 900;
    g.connect(flt); flt.connect(dest);
  },
  start(kind) {
    if (!Sfx.ensure()) return;
    const c = Sfx.ctx;
    this.playing = true;
    this.currentKind = kind;
    const g = c.createGain();
    g.gain.value = 1;
    // simple echo
    const dl = c.createDelay(1); dl.delayTime.value = 0.42;
    const fb = c.createGain(); fb.gain.value = 0.3;
    const wet = c.createGain(); wet.gain.value = 0.35;
    g.connect(Sfx.musicBus);
    g.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(Sfx.musicBus);
    this.fadeGain = g;
    const rng = RNG((Math.random() * 1e9) | 0);
    let total = 0;
    if (kind === 'calm' || kind === 'menu' || kind === 'credits') {
      // gentle generative piano over a warm progression
      const prog = rng.pick([
        [[57, 60, 64], [55, 59, 62], [53, 57, 60], [55, 59, 62]],   // Am G F G
        [[53, 57, 60], [57, 60, 64], [50, 53, 57], [55, 59, 62]],   // F Am Dm G
        [[48, 52, 55], [45, 48, 52], [53, 57, 60], [55, 59, 62]],   // C Am F G
      ]);
      const bars = kind === 'credits' ? 12 : 8;
      const barLen = 4.4;
      for (let bar = 0; bar < bars; bar++) {
        const chord = prog[bar % prog.length];
        const t = bar * barLen;
        this.pad(g, chord[0] - 12, t, barLen * 1.1, 0.05);
        // sparse arpeggio
        const notes = 2 + rng.nextInt(4);
        for (let n = 0; n < notes; n++) {
          const nt = t + rng.next() * barLen * 0.8;
          const pick = chord[rng.nextInt(3)] + rng.pick([0, 12, 12, 24]);
          this.piano(g, pick, nt, 2.5 + rng.next() * 2, 0.1 + rng.next() * 0.08);
        }
        if (rng.chance(0.5)) {
          const mel = chord[rng.nextInt(3)] + 24 + rng.pick([0, 2, 4, 7]);
          this.piano(g, mel, t + rng.next() * barLen, 3, 0.06);
        }
      }
      total = bars * barLen + 4;
    } else if (kind === 'nether') {
      const barLen = 5;
      for (let bar = 0; bar < 8; bar++) {
        const t = bar * barLen;
        this.pad(g, 33 + rng.pick([0, 1, 6]), t, barLen * 1.2, 0.06);
        if (rng.chance(0.6)) this.piano(g, 57 + rng.pick([0, 1, 6, 13]), t + rng.next() * barLen, 3, 0.05);
      }
      total = 44;
    } else if (kind === 'end') {
      const barLen = 5;
      for (let bar = 0; bar < 8; bar++) {
        const t = bar * barLen;
        this.pad(g, 36 + rng.pick([0, 3, 5]), t, barLen * 1.25, 0.055);
        if (rng.chance(0.7)) this.piano(g, 72 + rng.pick([0, 3, 7, 10]), t + rng.next() * barLen, 4, 0.045);
      }
      total = 44;
    }
    setTimeout(() => {
      if (this.currentKind === kind) {
        this.playing = false;
        this.currentKind = null;
        this.nextT = kind === 'menu' || kind === 'credits' ? 3 : 45 + Math.random() * 90;
      }
    }, total * 1000);
  },
};

'use strict';
// ============ ui.js — HUD + all screens (2D canvas overlay) ============

const UI = {
  canvas: null, ctx: null, scale: 2,
  screen: 'none', // none|inventory|crafting|furnace|chest|pause|options|controls
  mx: 0, my: 0, mouseDown: false,
  cursorStack: null,
  craftGrid: new Array(9).fill(null),
  craftSize: 2,
  furnaceBE: null, chestBE: null,
  buttons: [], sliders: [], dragSlider: null,
  seedInput: '', seedFocus: true,
  nameInput: '', createFocus: 'name', selectedWorld: null, createMode: 'survival',
  creativeScroll: 0, creativeItems: null,
  toasts: [], messages: [],
  itemNameT: 0, itemNameTxt: '',
  optionsBack: 'pause',

  init() {
    this.canvas = document.getElementById('ui');
    this.ctx = this.canvas.getContext('2d');
    this.resize();
    window.addEventListener('resize', () => this.resize());
  },
  resize() {
    this.canvas.width = window.innerWidth;

    this.scale = Math.max(1, Math.min(floor(window.innerWidth / 320), floor(window.innerHeight / 240)));

  },
  W() { return this.canvas.width / this.scale; },
  H() { return this.canvas.height / this.scale; },

  // ---------- primitives ----------
  rect(x, y, w, h, color) {
    const s = this.scale;
    this.ctx.fillStyle = color;
    this.ctx.fillRect(x * s, y * s, w * s, h * s);
  },
  text(t, x, y, color = '#FFFFFF', shadow = true) { Font.draw(this.ctx, t, x * this.scale, y * this.scale, color, this.scale, shadow); },
  textC(t, cx, y, color = '#FFFFFF', shadow = true) { Font.drawCentered(this.ctx, t, cx * this.scale, y * this.scale, color, this.scale, shadow); },
  textScaled(t, x, y, color, mult, shadow = true) { Font.draw(this.ctx, t, x * this.scale, y * this.scale, color, this.scale * mult, shadow); },
  icon(id, x, y) {
    const cv = Tex.icons[id];

  },
  drawStack(stack, x, y) {
    if (!stack) return;

    if (stack.n > 1) {

      Font.draw(this.ctx, t, (x + 17 - Font.width(t)) * this.scale, (y + 9) * this.scale, '#FFFFFF', this.scale);
    }
    if (stack.dur !== undefined && Items[stack.id].dur && stack.dur < Items[stack.id].dur) {
      const f = stack.dur / Items[stack.id].dur;
      this.rect(x + 2, y + 14, 12, 1, '#000000');
      this.rect(x + 2, y + 14, Math.max(1, 12 * f), 1, f > 0.5 ? '#3fbf3f' : f > 0.25 ? '#bfbf3f' : '#bf3f3f');

  },
  panel(x, y, w, h) {

    this.rect(x, y, w, h, '#c6c6c6');
    this.rect(x, y, w, 1, '#ffffff'); this.rect(x, y, 1, h, '#ffffff');
    this.rect(x + 1, y + 1, w - 2, 1, '#dbdbdb'); this.rect(x + 1, y + 1, 1, h - 2, '#dbdbdb');
    this.rect(x, y + h - 1, w, 1, '#555555'); this.rect(x + w - 1, y, 1, h, '#555555');
    this.rect(x + 1, y + h - 2, w - 2, 1, '#8b8b8b'); this.rect(x + w - 2, y + 1, 1, h - 2, '#8b8b8b');

  slotBg(x, y) {

  button(id, x, y, w, label, small) {

  },
  slider(id, x, y, w, label, value) {
    this.rect(x, y, w, 20, '#000000aa');
    this.rect(x, y, w, 1, '#2f2f2f'); this.rect(x, y + 19, w, 1, '#a0a0a0');

    this.rect(kx, y, 8, 20, '#8b96b8');
    this.rect(kx, y, 8, 1, '#c3cbe0'); this.rect(kx, y + 19, 8, 1, '#40485f');
    this.textC(label, x + w / 2, y + 6, '#ffffff');
