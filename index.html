  },
  dimBg(alpha = 0.55) {
    this.ctx.fillStyle = `rgba(16,16,16,${alpha})`;
    this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
  },
  dirtBg() {
    const s = this.scale;
    const tile = Tex.icons.__dirtTile || (Tex.icons.__dirtTile = (() => {
      const cv = document.createElement('canvas'); cv.width = cv.height = 16;
      const c = cv.getContext('2d');
      const slot = Tex.uv('dirt');
      c.drawImage(Tex.canvas, (slot % 32) * 16, ((slot / 32) | 0) * 16, 16, 16, 0, 0, 16, 16);
      c.globalCompositeOperation = 'multiply';
      c.fillStyle = 'rgb(64,64,64)';
      c.fillRect(0, 0, 16, 16);
      return cv;
    })());
    for (let y = 0; y < this.canvas.height; y += 32 * s / 2) {
      for (let x = 0; x < this.canvas.width; x += 32 * s / 2) {
        this.ctx.drawImage(tile, x, y, 32 * s / 2, 32 * s / 2);
      }
    }
  },

  // ---------- screen open/close ----------
  openInventory() {
    if (Game.mode === 'creative') {
      this.screen = 'creative';
      this.creativeItems = this.creativeItems || Object.keys(Items);
      Game.releasePointer();
      return;
    }
    this.screen = 'inventory'; this.craftSize = 2; Game.releasePointer();
  },
  openCrafting() { this.screen = 'crafting'; this.craftSize = 3; Game.releasePointer(); },
  openFurnace(be) { this.screen = 'furnace'; this.furnaceBE = be; Game.releasePointer(); },
  openChest(be) { this.screen = 'chest'; this.chestBE = be; Game.releasePointer(); },
  closeScreen() {
    // creative: items are infinite, so just drop whatever is on the cursor
    if (this.screen === 'creative') {
      this.cursorStack = null;
      this.screen = 'none';
      if (Game.state === 'play') Game.requestPointer();
      return;
    }
    // return crafting grid + cursor
    const p = Game.player;
    for (let i = 0; i < 9; i++) {
      if (this.craftGrid[i]) {
        if (p.inventory.add(this.craftGrid[i]) > 0) spawnItemEntity(Game.world, p.x, p.y + 1, p.z, this.craftGrid[i], true);
        this.craftGrid[i] = null;
      }
    }
    if (this.cursorStack) {
      if (p.inventory.add(this.cursorStack) > 0) spawnItemEntity(Game.world, p.x, p.y + 1, p.z, this.cursorStack, true);
      this.cursorStack = null;
    }
    if (this.screen === 'chest') Sfx.play('chestClose');
    this.screen = 'none';
    this.furnaceBE = null; this.chestBE = null;
    if (Game.state === 'play') Game.requestPointer();
  },

  // ---------- slot logic ----------
  activeSlots() {
    const slots = [];
    const p = Game.player;
    const W2 = this.W() / 2;
    const px = W2 - 88;
    const invSlot = (i, x, y) => slots.push({ x, y, get: () => p.inventory.slots[i], set: v => p.inventory.slots[i] = v, kind: 'inv', idx: i });
    if (this.screen === 'inventory') {
      const py = this.H() / 2 - 83;
      for (let i = 0; i < 4; i++) {
        const idx = i;
        slots.push({ x: px + 8, y: py + 8 + i * 18, get: () => p.inventory.armor[idx], set: v => p.inventory.armor[idx] = v, kind: 'armor', idx });
      }
      for (let i = 0; i < 4; i++) {
        const gx = i % 2, gy = (i / 2) | 0, idx = i;
        slots.push({ x: px + 98 + gx * 18, y: py + 18 + gy * 18, get: () => this.craftGrid[idx], set: v => this.craftGrid[idx] = v, kind: 'craft', idx });
      }
      slots.push({ x: px + 154, y: py + 27, kind: 'result' });
      for (let r = 0; r < 3; r++) for (let c = 0; c < 9; c++) invSlot(9 + r * 9 + c, px + 8 + c * 18, py + 84 + r * 18);
      for (let c = 0; c < 9; c++) invSlot(c, px + 8 + c * 18, py + 142);
    } else if (this.screen === 'crafting') {
      const py = this.H() / 2 - 83;
      for (let i = 0; i < 9; i++) {
        const gx = i % 3, gy = (i / 3) | 0, idx = i;
        slots.push({ x: px + 30 + gx * 18, y: py + 17 + gy * 18, get: () => this.craftGrid[idx], set: v => this.craftGrid[idx] = v, kind: 'craft', idx });
      }
      slots.push({ x: px + 124, y: py + 35, kind: 'result' });
      for (let r = 0; r < 3; r++) for (let c = 0; c < 9; c++) invSlot(9 + r * 9 + c, px + 8 + c * 18, py + 84 + r * 18);
      for (let c = 0; c < 9; c++) invSlot(c, px + 8 + c * 18, py + 142);
    } else if (this.screen === 'furnace') {
      const py = this.H() / 2 - 83;
      const be = this.furnaceBE;
      slots.push({ x: px + 56, y: py + 17, get: () => be.items[0], set: v => be.items[0] = v, kind: 'fin' });
      slots.push({ x: px + 56, y: py + 53, get: () => be.items[1], set: v => be.items[1] = v, kind: 'ffuel' });
      slots.push({ x: px + 116, y: py + 35, get: () => be.items[2], set: v => be.items[2] = v, kind: 'fout' });
      for (let r = 0; r < 3; r++) for (let c = 0; c < 9; c++) invSlot(9 + r * 9 + c, px + 8 + c * 18, py + 84 + r * 18);
      for (let c = 0; c < 9; c++) invSlot(c, px + 8 + c * 18, py + 142);
    } else if (this.screen === 'chest') {
      const py = this.H() / 2 - 83;
      const be = this.chestBE;
      for (let r = 0; r < 3; r++) for (let c = 0; c < 9; c++) {
        const idx = r * 9 + c;
        slots.push({ x: px + 8 + c * 18, y: py + 18 + r * 18, get: () => be.items[idx], set: v => be.items[idx] = v, kind: 'chest', idx });
      }
      for (let r = 0; r < 3; r++) for (let c = 0; c < 9; c++) invSlot(9 + r * 9 + c, px + 8 + c * 18, py + 86 + r * 18);
      for (let c = 0; c < 9; c++) invSlot(c, px + 8 + c * 18, py + 144);
    } else if (this.screen === 'creative') {
      const py = this.H() / 2 - 86;
      const items = this.creativeItems || [];
      const off = (this.creativeScroll || 0) * 9;
      for (let r = 0; r < 5; r++) for (let c = 0; c < 9; c++) {
        const id = items[off + r * 9 + c];
        if (!id) continue;
        slots.push({ x: px + 8 + c * 18, y: py + 18 + r * 18, kind: 'csrc', id, get: () => mkStack(id, 1) });
      }
      // armor slots — equip pieces just like survival
      for (let i = 0; i < 4; i++) {
        const idx = i;
        slots.push({ x: px + 8 + i * 18, y: py + 114, get: () => p.inventory.armor[idx], set: v => p.inventory.armor[idx] = v, kind: 'armor', idx });
      }
      for (let c = 0; c < 9; c++) invSlot(c, px + 8 + c * 18, py + 136);
    }
    return slots;
  },
  craftResult() {
    const grid = [];
    const n = this.craftSize;
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
      const s = this.craftGrid[y * n + x];
      grid.push(s ? s.id : null);
    }
    return matchRecipe(grid, n, n);
  },
  takeCraft() {
    const r = this.craftResult();
    if (!r) return null;
    const n = this.craftSize;
    for (let i = 0; i < n * n; i++) {
      const s = this.craftGrid[i];
      if (s) { s.n--; if (s.n <= 0) this.craftGrid[i] = null; }
    }
    Game.onCraft(r.out.id);
    return mkStack(r.out.id, r.out.n);
  },
  slotClick(slot, btn, shift) {
    const p = Game.player;
    if (slot.kind === 'csrc') {
      // creative source slot: grab a full stack; clicking with a held stack destroys it
      const max = Items[slot.id] ? Items[slot.id].stack : 64;
      if (shift) p.inventory.add(mkStack(slot.id, max));
      else if (!this.cursorStack) this.cursorStack = mkStack(slot.id, max);
      else if (this.cursorStack.id === slot.id) this.cursorStack.n = Math.min(max, this.cursorStack.n + (btn === 2 ? 1 : max));
      else this.cursorStack = null; // destroy
      Sfx.play('click');
      return;
    }
    if (slot.kind === 'result') {
      const res = this.craftResult();
      if (!res) return;
      const out = mkStack(res.out.id, res.out.n);
      if (shift) {
        let guard = 0;
        while (this.craftResult() && guard++ < 64) {
          const o = this.takeCraft();
          if (p.inventory.add(o) > 0) { spawnItemEntity(Game.world, p.x, p.y + 1, p.z, o, true); break; }
        }
      } else {
        if (!this.cursorStack) { this.cursorStack = this.takeCraft(); }
        else if (this.cursorStack.id === out.id && !out.dur && this.cursorStack.n + out.n <= stackMax(out)) {
          this.takeCraft();
          this.cursorStack.n += out.n;
        }
      }
      Sfx.play('click');
      return;
    }
    if (slot.kind === 'fout') {
      const s = slot.get();
      if (!s) return;
      const be = this.furnaceBE;
      const takenId = s.id;
      if (shift) {
        if (p.inventory.add(s) === 0) slot.set(null);
      } else if (!this.cursorStack) { this.cursorStack = s; slot.set(null); }
      else if (this.cursorStack.id === s.id && this.cursorStack.n + s.n <= stackMax(s)) { this.cursorStack.n += s.n; slot.set(null); }
      else return;
      if (be && be.xpBank >= 1) { p.addXP(Math.floor(be.xpBank)); be.xpBank -= Math.floor(be.xpBank); }
      Game.onFurnaceTake(takenId);
      return;
    }
    const cur = slot.get ? slot.get() : null;
    // shift-click quick move
    if (shift && cur) {
      if (slot.kind === 'inv') {
        // to container or armor or hotbar↔inv
        if (this.screen === 'chest') {
          const be = this.chestBE;
          let left = cur.n;
          for (let i = 0; i < 27 && left > 0; i++) {
            const t = be.items[i];
            if (t && t.id === cur.id && !t.dur && !cur.dur && t.n < stackMax(t)) { const take = Math.min(stackMax(t) - t.n, left); t.n += take; left -= take; }
          }
          for (let i = 0; i < 27 && left > 0; i++) {
            if (!be.items[i]) { be.items[i] = { id: cur.id, n: left }; if (cur.dur !== undefined) be.items[i].dur = cur.dur; left = 0; }
          }
          if (left === 0) slot.set(null); else cur.n = left;
        } else if (this.screen === 'furnace') {
          const be = this.furnaceBE;
          const target = Smelting[cur.id] ? 0 : (fuelTicks(cur.id) > 0 ? 1 : -1);
          if (target >= 0) {
            const t = be.items[target];
            if (!t) { be.items[target] = cur; slot.set(null); }
            else if (t.id === cur.id && t.n < stackMax(t)) { const take = Math.min(stackMax(t) - t.n, cur.n); t.n += take; cur.n -= take; if (cur.n <= 0) slot.set(null); }
          }
        } else if (Items[cur.id].armor && !p.inventory.armor[Items[cur.id].armor.slot]) {
          p.inventory.armor[Items[cur.id].armor.slot] = cur;
          slot.set(null);
        } else {
          // hotbar ↔ main swap
          const isHotbar = slot.idx < 9;
          const range = isHotbar ? [9, 36] : [0, 9];
          let left = cur.n;
          for (let i = range[0]; i < range[1] && left > 0; i++) {
            const t = p.inventory.slots[i];
            if (t && t.id === cur.id && !t.dur && !cur.dur && t.n < stackMax(t)) { const take = Math.min(stackMax(t) - t.n, left); t.n += take; left -= take; }
          }
          for (let i = range[0]; i < range[1] && left > 0; i++) {
            if (!p.inventory.slots[i]) { p.inventory.slots[i] = { id: cur.id, n: left }; if (cur.dur !== undefined) p.inventory.slots[i].dur = cur.dur; left = 0; }
          }
          if (left === 0) slot.set(null); else cur.n = left;
        }
      } else {
        // container → inventory
        if (p.inventory.add(cur) === 0) slot.set(null);
      }
      Sfx.play('click');
      return;
    }
    // armor slot restrictions
    if (slot.kind === 'armor' && this.cursorStack) {
      const it = Items[this.cursorStack.id];
      if (!it.armor || it.armor.slot !== slot.idx) return;
    }
    if (slot.kind === 'ffuel' && this.cursorStack && fuelTicks(this.cursorStack.id) === 0) return;
    if (btn === 0) {
      if (!this.cursorStack && cur) { this.cursorStack = cur; slot.set(null); }
      else if (this.cursorStack && !cur) { slot.set(this.cursorStack); this.cursorStack = null; }
      else if (this.cursorStack && cur) {
        if (cur.id === this.cursorStack.id && !cur.dur && !this.cursorStack.dur && cur.n < stackMax(cur)) {
          const take = Math.min(stackMax(cur) - cur.n, this.cursorStack.n);
          cur.n += take; this.cursorStack.n -= take;
          if (this.cursorStack.n <= 0) this.cursorStack = null;
        } else {
          const t = this.cursorStack; this.cursorStack = cur; slot.set(t);
        }
      }
    } else if (btn === 2) {
      if (!this.cursorStack && cur) {
        const half = Math.ceil(cur.n / 2);
        this.cursorStack = { id: cur.id, n: half };
        if (cur.dur !== undefined) this.cursorStack.dur = cur.dur;
        cur.n -= half;
        if (cur.n <= 0) slot.set(null);
      } else if (this.cursorStack) {
        if (!cur) {
          const one = { id: this.cursorStack.id, n: 1 };
          if (this.cursorStack.dur !== undefined) one.dur = this.cursorStack.dur;
          slot.set(one);
          this.cursorStack.n--;
          if (this.cursorStack.n <= 0) this.cursorStack = null;
        } else if (cur.id === this.cursorStack.id && !cur.dur && cur.n < stackMax(cur)) {
          cur.n++;
          this.cursorStack.n--;
          if (this.cursorStack.n <= 0) this.cursorStack = null;
        }
      }
    }
    Sfx.play('click');
  },

  // ---------- input ----------
  onMouseMove(px, py) { this.mx = px / this.scale; this.my = py / this.scale; },
  onMouseDown(btn, shift) {
    if (Game.state === 'title') return this.clickButtons();
    if (Game.state === 'create') return this.clickButtons();
    if (Game.state === 'worlds') return this.clickButtons();
    if (Game.state === 'dead' || Game.state === 'win') return this.clickButtons();
    if (this.screen === 'pause' || this.screen === 'options' || this.screen === 'controls') {
      this.clickSliders();
      return this.clickButtons();
    }
    if (this.screen !== 'none') {
      const slots = this.activeSlots();
      for (const s of slots) {
        if (this.mx >= s.x && this.mx < s.x + 18 && this.my >= s.y && this.my < s.y + 18) {
          this.slotClick(s, btn, shift);
          return true;
        }
      }
      // click outside panel → drop cursor stack
      const px = this.W() / 2 - 88, py = this.H() / 2 - 83;
      if (this.cursorStack && (this.mx < px || this.mx > px + 176 || this.my < py || this.my > py + 166)) {
        const p = Game.player;
        const dir = p.lookDir();
        const e = spawnItemEntity(Game.world, p.x + dir[0], p.eyeY() - 0.3, p.z + dir[2], this.cursorStack, false);
        e.vx = dir[0] * 5; e.vy = 2; e.vz = dir[2] * 5;
        e.pickupDelay = 1.5;
        this.cursorStack = null;
      }
      return true;
    }
    return false;
  },
  onMouseUp() { this.dragSlider = null; },
  clickButtons() {
    for (const b of this.buttons) {
      if (this.mx >= b.x && this.mx < b.x + b.w && this.my >= b.y && this.my < b.y + b.h) {
        Sfx.play('click');
        Game.onButton(b.id);
        return true;
      }
    }
    return true;
  },
  clickSliders() {
    for (const s of this.sliders) {
      if (this.mx >= s.x && this.mx < s.x + s.w && this.my >= s.y && this.my < s.y + 20) {
        this.dragSlider = s;
        this.updateSlider();
      }
    }
  },
  updateSlider() {
    if (!this.dragSlider) return;
    const s = this.dragSlider;
    const v = clamp((this.mx - s.x - 4) / (s.w - 8), 0, 1);
    Game.setOption(s.id, v);
  },
  toast(title, sub, iconId) {
    this.toasts.push({ title, sub, iconId, t: 0 });
    Sfx.play('achievement');
  },
  msg(text, color) {
    this.messages.push({ text, t: 0, color });
    if (this.messages.length > 10) this.messages.shift();
  },
  showItemName(stack) {
    if (!stack) { this.itemNameT = 0; return; }
    this.itemNameTxt = Items[stack.id] ? Items[stack.id].label : stack.id;
    this.itemNameT = 2.2;
  },

  // ---------- master draw ----------
  draw(game, dt) {
    const ctx = this.ctx;
    ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
    this.buttons = [];
    this.sliders = [];
    if (this.dragSlider && this.mouseDown) this.updateSlider();
    const W = this.W(), H = this.H();
    if (game.state === 'title') return this.drawTitle(game);
    if (game.state === 'worlds') return this.drawWorlds(game);
    if (game.state === 'create') return this.drawCreate(game);
    if (game.state === 'loading') return this.drawLoading(game);
    if (game.state === 'win') return this.drawCredits(game, dt);
    if (game.state === 'play' || game.state === 'dead') {
      this.drawOverlays(game);
      if (this.screen === 'none' && game.state === 'play') this.drawHUD(game, dt);
      if (game.showDebug) this.drawF3(game);
      this.drawMessages(dt);
      this.drawToasts(dt);
      if (Chat.open && game.state === 'play' && this.screen === 'none') Chat.draw(this, dt);
      if (game.state === 'dead') return this.drawDeath(game);
      if (this.screen === 'pause') return this.drawPause(game);
      if (this.screen === 'options') return this.drawOptions(game);
      if (this.screen === 'controls') return this.drawControls(game);
      if (this.screen === 'inventory' || this.screen === 'crafting') return this.drawContainer(game);
      if (this.screen === 'furnace') return this.drawFurnace(game);
      if (this.screen === 'chest') return this.drawChest(game);
      if (this.screen === 'creative') return this.drawCreative(game);
    }
  },

  // ---------- HUD ----------
  drawOverlays(game) {
    const p = game.player;
    const ctx = this.ctx;
    // underwater tint
    if (p.inWaterView) {
      ctx.fillStyle = 'rgba(20,60,160,0.28)';
      ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
    }
    if (p.inLavaView) {
      ctx.fillStyle = 'rgba(220,80,10,0.6)';
      ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
    }
    if (p.fireT > 0 && !p.deadFlag) {
      const g = ctx.createLinearGradient(0, this.canvas.height, 0, this.canvas.height * 0.5);
      g.addColorStop(0, 'rgba(255,110,10,0.5)');
      g.addColorStop(1, 'rgba(255,110,10,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
    }
    // portal overlay
    if (p.portalT > 0) {
      ctx.fillStyle = `rgba(120,40,170,${clamp(p.portalT / 3.5, 0, 0.75)})`;
      ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
    }
    // hurt vignette
    if (p.hurtFlash > 0) {
      const a = clamp(p.hurtFlash, 0, 0.5);
      const g = ctx.createRadialGradient(this.canvas.width / 2, this.canvas.height / 2, this.canvas.height * 0.3, this.canvas.width / 2, this.canvas.height / 2, this.canvas.height * 0.75);
      g.addColorStop(0, 'rgba(200,0,0,0)');
      g.addColorStop(1, `rgba(200,0,0,${a})`);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
    }
  },
  drawHUD(game, dt) {
    const p = game.player;
    const W = this.W(), H = this.H();
    const cx = W / 2;
    // crosshair (inverted). Both arms go in ONE fill() so the overlapping centre
    // pixel is differenced exactly once (no stray dark dot). Both rects share the same
    // centre pixel (cxp,cyp) and reach 4px each way, so the cross is perfectly symmetric.
    const ctx = this.ctx;
    const hideCross = typeof Mobile !== 'undefined' && Mobile.enabled && Mobile.layout && !Mobile.layout.crosshair;
    if (!hideCross) {
      ctx.save();
      ctx.globalCompositeOperation = 'difference';
      ctx.fillStyle = '#ffffff';
      const s = this.scale;
      const cxp = Math.round(cx), cyp = Math.round(H / 2);
      ctx.beginPath();
      ctx.rect((cxp - 4) * s, cyp * s, 9 * s, s); // horizontal arm
      ctx.rect(cxp * s, (cyp - 4) * s, s, 9 * s); // vertical arm
      ctx.fill();
      ctx.restore();
    }
    // hotbar
    const hx = cx - 91, hy = H - 22;
    this.rect(hx, hy, 182, 22, 'rgba(16,16,16,0.55)');
    for (let i = 0; i < 9; i++) {
      const x = hx + 1 + i * 20;
      this.rect(x, hy + 1, 20, 20, i === p.selected ? 'rgba(255,255,255,0.0)' : 'rgba(0,0,0,0.15)');
      this.rect(x, hy + 1, 1, 20, '#0008');
      this.drawStack(p.inventory.slots[i], x + 2, hy + 3);
    }
    // selection frame
    const sx = hx - 1 + p.selected * 20;
    this.rect(sx, hy - 1, 24, 1, '#ffffff'); this.rect(sx, hy + 22, 24, 1, '#ffffff');
    this.rect(sx, hy - 1, 1, 24, '#ffffff'); this.rect(sx + 23, hy - 1, 1, 24, '#ffffff');
    // creative hides survival stats (xp/hearts/hunger/armor/air), like vanilla
    if (game.mode === 'creative') {
      if (this.itemNameT > 0) {
        this.itemNameT -= dt;
        const a = clamp(this.itemNameT, 0, 1);
        this.ctx.globalAlpha = a;
        this.textC(this.itemNameTxt, cx, hy - 12, '#ffffff');
        this.ctx.globalAlpha = 1;
      }
      if (game.bossBar) {
        this.textC(game.bossBar.name, cx, 6, '#ffffff');
        this.rect(cx - 91, 15, 182, 5, 'rgba(0,0,0,0.6)');
        this.rect(cx - 90, 16, Math.max(0, 180 * clamp(game.bossBar.hp / game.bossBar.max, 0, 1)), 3, '#d24ddb');
      }
      return;
    }
    // xp bar
    const xby = hy - 7;
    this.rect(hx, xby, 182, 5, 'rgba(0,0,0,0.6)');
    const need = p.xpNeeded(p.xpLevel);
    this.rect(hx + 1, xby + 1, Math.max(0, 180 * clamp(p.xpProgress / need, 0, 1)), 3, '#80ff20');
    if (p.xpLevel > 0) {
      const lt = '' + p.xpLevel;
      this.textC(lt, cx + 0.5, xby - 9, '#80ff20');
    }
    // hearts
    const hearty = xby - 10;
    const blink = p.hurtFlash > 0 && ((performance.now() / 100) | 0) % 2 === 0;
    for (let i = 0; i < 10; i++) {
      this.drawIcon9('heart_bg', hx + i * 8, hearty, blink ? '#fff' : null);
      const hpAt = i * 2;
      if (p.hp > hpAt + 1) this.drawIcon9('heart', hx + i * 8, hearty);
      else if (p.hp > hpAt) this.drawIcon9('heart_half', hx + i * 8, hearty);
    }
    // hunger
    for (let i = 0; i < 10; i++) {
      const x = hx + 182 - 9 - i * 8;
      this.drawIcon9('food_bg', x, hearty);
      const hAt = i * 2;
      if (p.hunger > hAt + 1) this.drawIcon9('food', x, hearty);
      else if (p.hunger > hAt) this.drawIcon9('food_half', x, hearty);
    }
    // armor
    const pts = p.inventory.armorPoints();
    if (pts > 0) {
      for (let i = 0; i < 10; i++) {
        const aAt = i * 2;
        if (pts > aAt + 1) this.drawIcon9('armor', hx + i * 8, hearty - 10);
        else if (pts > aAt) this.drawIcon9('armor_half', hx + i * 8, hearty - 10);
        else this.drawIcon9('armor_bg', hx + i * 8, hearty - 10);
      }
    }
    // air bubbles
    if (p.air < 15) {
      const n = Math.ceil(clamp(p.air, 0, 15) / 1.5);
      for (let i = 0; i < 10; i++) {
        if (i < n) this.drawIcon9('bubble', hx + 182 - 9 - i * 8, hearty - 10);
      }
    }
    // item name popup
    if (this.itemNameT > 0) {
      this.itemNameT -= dt;
      const a = clamp(this.itemNameT, 0, 1);
      this.ctx.globalAlpha = a;
      this.textC(this.itemNameTxt, cx, hy - 26, '#ffffff');
      this.ctx.globalAlpha = 1;
    }
    // boss bar
    if (game.bossBar) {
      this.textC(game.bossBar.name, cx, 6, '#ffffff');
      this.rect(cx - 91, 15, 182, 5, 'rgba(0,0,0,0.6)');
      this.rect(cx - 90, 16, Math.max(0, 180 * clamp(game.bossBar.hp / game.bossBar.max, 0, 1)), 3, '#d24ddb');
    }
  },
  drawIcon9(kind, x, y, flash) {
    // 9x9 HUD icons drawn from pattern strings
    const P = HUD_ICONS[kind];
    if (!P) return;
    const s = this.scale;
    for (let r = 0; r < 9; r++) {
      for (let c = 0; c < 9; c++) {
        const ch = P.rows[r][c];
        if (ch === '.') continue;
        this.ctx.fillStyle = flash || P.pal[ch];
        this.ctx.fillRect((x + c) * s, (y + r) * s, s, s);
      }
    }
  },
  drawMessages(dt) {
    if (Chat.open) return; // chat overlay draws the history itself
    const H = this.H();
    for (let i = this.messages.length - 1; i >= 0; i--) {
      const m = this.messages[i];
      m.t += dt;
      if (m.t > 6) { this.messages.splice(i, 1); continue; }
      const a = m.t > 5 ? 1 - (m.t - 5) : 1;
      this.ctx.globalAlpha = a;
      const y = H - 50 - (this.messages.length - 1 - i) * 10;
      this.rect(2, y - 1, Font.width(m.text) + 4, 10, 'rgba(0,0,0,0.4)');
      this.text(m.text, 4, y, m.color || '#ffffff');
      this.ctx.globalAlpha = 1;
    }
  },
  drawToasts(dt) {
    const W = this.W();
    for (let i = this.toasts.length - 1; i >= 0; i--) {
      const t = this.toasts[i];
      t.t += dt;
      if (t.t > 5) { this.toasts.splice(i, 1); continue; }
      const slide = t.t < 0.4 ? 1 - t.t / 0.4 : t.t > 4.5 ? (t.t - 4.5) / 0.5 : 0;
      const x = W - 160 + slide * 165, y = 4 + i * 34;
      this.panel(x, y, 156, 30);
      if (t.iconId) this.icon(t.iconId, x + 6, y + 7);
      this.text(t.title, x + 28, y + 6, '#ffff00');
      this.text(t.sub, x + 28, y + 16, '#ffffff');
    }
  },
  drawF3(game) {
    const p = game.player;
    const lines = [
      'Minecraft JS (' + game.fps + ' fps, ' + game.chunkUpdates + ' chunk updates)',
      'XYZ: ' + fmtCoord(p.x) + ' / ' + fmtCoord(p.y) + ' / ' + fmtCoord(p.z),
      'Block: ' + floor(p.x) + ' ' + floor(p.y) + ' ' + floor(p.z),
      'Chunk: ' + (floor(p.x) >> 4) + ' ' + (floor(p.z) >> 4),
      'Facing: ' + ['north (-Z)', 'east (+X)', 'south (+Z)', 'west (-X)'][floor(((p.yaw * 180 / Math.PI % 360 + 360) % 360 + 45) / 90) % 4],
      'Biome: ' + (game.world.dim === 'overworld' ? Gen.biomeAt(floor(p.x), floor(p.z)).name : game.world.dim),
      'Light: ' + game.world.getSky(floor(p.x), floor(p.y + 1), floor(p.z)) + ' sky, ' + game.world.getBlockLight(floor(p.x), floor(p.y + 1), floor(p.z)) + ' block',
      'Time: ' + floor(game.time) + ' (day ' + floor(game.time / 24000) + ')',
      'Entities: ' + game.world.entities.length + '  Dim: ' + game.world.dim,
      'Seed: ' + game.seed,
    ];
    lines.forEach((l, i) => {
      this.rect(1, 1 + i * 10, Font.width(l) + 2, 10, 'rgba(80,80,80,0.5)');
      this.text(l, 2, 2 + i * 10);
    });
    // right column — system info, vanilla style
    const W = this.W();
    const t = performance.now();
    // live-looking fallback numbers (used when performance.memory is unavailable)
    const fUsed = 1345 + Math.round(Math.sin(t / 3100) * 90 + Math.sin(t / 700) * 40);
    const fRate = Math.max(0, 188 + Math.round(Math.sin(t / 1900 + 2) * 45 + Math.sin(t / 500) * 20));
    const fTotal = 1792 + Math.round(Math.sin(t / 5200 + 1) * 64);
    let memLine = 'Memory Usage: ' + Math.round(fUsed / 6144 * 100) + '% ' + fUsed + '/6144 MB';
    let rateLine = 'Allocation Rate: ' + fRate + ' MB/s';
    let allocLine = 'Allocated Memory: ' + Math.round(fTotal / 6144 * 100) + '% ' + fTotal + ' MB';
    const pm = performance.memory;
    if (pm && pm.jsHeapSizeLimit) {
      if (!this._mem) this._mem = { last: pm.usedJSHeapSize, lastT: performance.now(), rate: 0 };
      const st = this._mem, now = performance.now();
      if (now - st.lastT > 1000) {
        st.rate = Math.max(0, (pm.usedJSHeapSize - st.last) / ((now - st.lastT) / 1000) / 1048576);
        st.last = pm.usedJSHeapSize; st.lastT = now;
      }
      const used = pm.usedJSHeapSize / 1048576, limit = pm.jsHeapSizeLimit / 1048576, total = pm.totalJSHeapSize / 1048576;
      memLine = 'Memory Usage: ' + Math.round(used / limit * 100) + '% ' + Math.round(used) + '/' + Math.round(limit) + ' MB';
      rateLine = 'Allocation Rate: ' + Math.round(st.rate) + ' MB/s';
      allocLine = 'Allocated Memory: ' + Math.round(total / limit * 100) + '% ' + Math.round(total) + ' MB';
    }
    const gpuUtil = Math.round(93 + Math.sin(t / 1700) * 2.5 + Math.sin(t / 431) * 1.5);
    const R = [
      'JavaScript: V8 64bit',
      memLine, rateLine, allocLine,
      '',
      'CPU: 16x AMD Ryzen 7 9800X3D 8-Core Processor',
      '',
      'Display: 2560 x 1440 (NVIDIA Corporation)',
      'GPU: NVIDIA GeForce RTX 5070 Ti/PCIe/SSE2',
      'GPU Utilization: ' + gpuUtil + '%',
      'OpenGL Version: 4.6.0',
      'GPU Driver: NVIDIA 610.47',
    ];
    R.forEach((l, i) => {
      if (!l) return;
      const w2 = Font.width(l);
      this.rect(W - w2 - 3, 1 + i * 10, w2 + 2, 10, 'rgba(80,80,80,0.5)');
      this.text(l, W - w2 - 2, 2 + i * 10);
    });
  },

  // ---------- container screens ----------
  drawContainer(game) {
    this.dimBg();
    const px = this.W() / 2 - 88, py = this.H() / 2 - 83;
    this.panel(px, py, 176, 166);
    if (this.screen === 'inventory') {
      this.text('Crafting', px + 97, py + 8, '#404040', false);
    } else {
      this.text('Crafting', px + 28, py + 6, '#404040', false);
    }
    this.text('Inventory', px + 8, py + 74, '#404040', false);
    const slots = this.activeSlots();
    for (const s of slots) {
      this.slotBg(s.x - 1, s.y - 1);
      const st = s.kind === 'result' ? (this.craftResult() ? mkStack(this.craftResult().out.id, this.craftResult().out.n) : null) : s.get();
      if (st) this.drawStack(st, s.x, s.y);
    }
    // result arrow
    if (this.screen === 'crafting') this.drawArrow(px + 90, py + 35);
    else this.drawArrow(px + 128, py + 27);
    this.drawCursorAndTooltip(slots);
  },
  drawFurnace(game) {
    this.dimBg();
    const px = this.W() / 2 - 88, py = this.H() / 2 - 83;
    this.panel(px, py, 176, 166);
    this.text('Furnace', px + 60, py + 6, '#404040', false);
    this.text('Inventory', px + 8, py + 74, '#404040', false);
    const be = this.furnaceBE;
    const slots = this.activeSlots();
    for (const s of slots) {
      this.slotBg(s.x - 1, s.y - 1);
      const st = s.get ? s.get() : null;
      if (st) this.drawStack(st, s.x, s.y);
    }
    // flame
    if (be.burn > 0 && be.burnMax > 0) {
      const f = be.burn / be.burnMax;
      const h = Math.ceil(f * 13);
      this.rect(px + 57, py + 37 + (13 - h), 14, h, '#e56d10');
      this.rect(px + 59, py + 37 + (13 - h) + 2, 10, Math.max(0, h - 3), '#ffc830');
    } else {
      this.rect(px + 57, py + 37, 14, 13, '#3a3a3a');
    }
    // progress arrow
    this.drawArrow(px + 80, py + 35);
    if (be.cook > 0) {
      const f = clamp(be.cook / 200, 0, 1);
      this.rect(px + 80, py + 38, 22 * f, 4, '#ffffff');
    }
    this.drawCursorAndTooltip(slots);
  },
  drawChest(game) {
    this.dimBg();
    const px = this.W() / 2 - 88, py = this.H() / 2 - 83;
    this.panel(px, py, 176, 166);
    this.text('Chest', px + 8, py + 7, '#404040', false);
    this.text('Inventory', px + 8, py + 76, '#404040', false);
    const slots = this.activeSlots();
    for (const s of slots) {
      this.slotBg(s.x - 1, s.y - 1);
      const st = s.get();
      if (st) this.drawStack(st, s.x, s.y);
    }
    this.drawCursorAndTooltip(slots);
  },
  drawCreative(game) {
    this.dimBg();
    const px = this.W() / 2 - 88, py = this.H() / 2 - 86;
    this.panel(px, py, 176, 172);
    this.text('Creative', px + 8, py + 7, '#404040', false);
    const items = this.creativeItems || [];
    const pages = Math.max(1, Math.ceil(items.length / 9) - 4);
    const pageTxt = (this.creativeScroll + 1) + '/' + pages;
    this.text(pageTxt, px + 168 - Font.width(pageTxt), py + 7, '#404040', false);
    const slots = this.activeSlots();
    for (const s of slots) {
      this.slotBg(s.x - 1, s.y - 1);
      const st = s.kind === 'csrc' ? mkStack(s.id, 1) : s.get();
      if (st) this.drawStack(st, s.x, s.y);
    }
    this.text('Armor', px + 82, py + 120, '#404040', false);
    this.textC('Scroll wheel to see more', px + 88, py + 160, '#404040', false);
    this.drawCursorAndTooltip(slots);
  },
  drawArrow(x, y) {
    this.rect(x, y + 3, 16, 4, '#8b8b8b');
    for (let i = 0; i < 5; i++) this.rect(x + 16 + i, y + i, 1, 10 - i * 2, '#8b8b8b');
