  },

  // ---------- environment ----------
  computeEnv() {
    const e = Renderer.env;
    const dim = this.world ? this.world.dim : 'overworld';
    e.dim = dim;
    if (dim === 'overworld') {
      const t = (this.time % 24000) / 24000;
      const ang = t * Math.PI * 2;
      const sunH = Math.sin(ang);
      e.sunAngle = ang;
      this.dayLight = clamp((sunH + 0.18) * 3.2, 0.235, 1);
      e.dayLight = this.dayLight;
      const day = clamp((sunH + 0.12) * 3.5, 0, 1);
      e.skyTop = [lerp(0.006, 0.45, day), lerp(0.008, 0.65, day), lerp(0.03, 1.0, day)];
      e.skyHorizon = [lerp(0.02, 0.72, day), lerp(0.026, 0.82, day), lerp(0.07, 0.96, day)];
      e.sunset = clamp(1 - Math.abs(sunH) * 4.5, 0, 1) * (day > 0.02 ? 1 : 0.4);
      e.starAlpha = clamp(1 - day * 2.2, 0, 1);
      e.skyTint = [lerp(0.5, 1, day), lerp(0.58, 1, day), 1];
      const rd = this.renderDist * 16;
      e.fogColor = e.skyHorizon.slice();
      e.fogStart = rd * 0.6; e.fogEnd = rd * 0.98;
    } else if (dim === 'nether') {
      this.dayLight = 0.25;
      e.dayLight = 0.25;
      e.skyTop = [0.09, 0.012, 0.012]; e.skyHorizon = [0.16, 0.025, 0.02];
      e.fogColor = [0.16, 0.025, 0.02];
      e.fogStart = 20; e.fogEnd = 78;
      e.starAlpha = 0; e.sunset = 0;
      e.skyTint = [1, 1, 1];
    } else {
      this.dayLight = 0.62;
      e.dayLight = 0.62;
      e.skyTop = [0.01, 0.008, 0.02]; e.skyHorizon = [0.045, 0.035, 0.06];
      e.fogColor = [0.045, 0.035, 0.06];
      e.fogStart = 70; e.fogEnd = 160;
      e.starAlpha = 0; e.sunset = 0;
      e.skyTint = [0.85, 0.8, 1];
    }
    // rain/thunder darkening + lightning flash (overworld only; no-op otherwise)
    Weather.applyEnv(e, this);
    // underwater override
    const p = this.player;
    if (p && p.inWaterView) {
      e.fogColor = [0.08, 0.16, 0.45];
      e.fogStart = 3; e.fogEnd = 24;
    } else if (p && p.inLavaView) {
      e.fogColor = [0.6, 0.2, 0.03];
      e.fogStart = 0.2; e.fogEnd = 2.5;
    }
  },

  // ---------- main loop ----------
  loop() {
    requestAnimationFrame(() => this.loop());
    const now = performance.now();
    let dt = Math.min((now - this.last) / 1000, 0.05);
    this.last = now;
    this.fpsAcc += dt; this.fpsN++;
    if (this.fpsAcc > 0.5) { this.fps = Math.round(this.fpsN / this.fpsAcc); this.fpsAcc = 0; this.fpsN = 0; }
    try {
      this.frame(dt);
      Mobile.draw();
    } catch (err) {
      console.error(err);
    }
  },
  frame(dt) {
    Music.update(dt, this);
    if (this.state === 'title' || this.state === 'create' || this.state === 'title_options' || this.state === 'worlds') {
      UI.draw(this, dt);
      return;
    }
    if (this.state === 'loading') {
      this.updateLoading();
      if (this.state === 'play' && this._afterLoad) { this._afterLoad(); this._afterLoad = null; }
      UI.draw(this, dt);
      return;
    }
    if (this.state === 'win') {
      UI.draw(this, dt);
      return;
    }
    const p = this.player, w = this.world;
    const paused = UI.screen === 'pause' || UI.screen === 'options' || UI.screen === 'controls' || UI.screen === 'touchedit';
    if (!paused && this.state === 'play') {
      // time
      this.time += dt * 20;
      if (this.portalCd > 0) this.portalCd -= dt;
      // fixed ticks
      this.tickAcc += dt;
      let ticks = 0;
      while (this.tickAcc >= 0.05 && ticks < 4) {
        this.tickAcc -= 0.05;
        this.tickCount++;
        w.tick(this);
        // animated textures
        const gl = Renderer.gl;
        gl.bindTexture(gl.TEXTURE_2D, Renderer.atlasTex);
        Tex.tickAnim(gl, this.tickCount);
        ticks++;
      }
      Mobile.update();
      p.update(dt, this);
      updateEntities(w, dt, this);
      Particles.update(dt, w);
      Weather.update(dt, this);
      // dragon boss bar
      this.bossBar = null;
      if (w.dim === 'end') {
        for (const e of w.entities) {
          if (e.type === 'dragon' && !e.dead) this.bossBar = { name: 'Ender Dragon', hp: e.hp, max: e.maxHp };
        }
      }
      // stream chunks
      this.streamChunks();
      // step sounds
      this.stepAcc = (this.stepAcc || 0) + (p.onGround ? Math.hypot(p.vx, p.vz) * dt : 0);
      if (this.stepAcc > 2.2) {
        this.stepAcc = 0;
        const ground = w.getBlock(floor(p.x), floor(p.y - 0.5), floor(p.z));
        if (ground !== B.AIR) {
          const def = Blocks[ground];
          Sfx.play('dig_' + def.sound, { vol: 0.16, pitch: 1.15 });
        }
      }
      // autosave
      this.saveTimer += dt;
      if (this.saveTimer > 45) { this.saveTimer = 0; this.saveGame(); }
    } else if (this.state === 'dead') {
      updateEntities(w, dt, this);
      Particles.update(dt, w);
      this.time += dt * 20;
    }
    this.computeEnv();
    this.render(dt);
    UI.draw(this, dt);
  },
  streamChunks() {
    const p = this.player, w = this.world;
    const pcx = floor(p.x) >> 4, pcz = floor(p.z) >> 4;
    const rd = this.renderDist;
    // generate a couple of missing chunks per frame (nearest first)
    let budget = 2;
    for (let r = 0; r <= rd + 1 && budget > 0; r++) {
      for (let dx = -r; dx <= r && budget > 0; dx++) for (let dz = -r; dz <= r && budget > 0; dz++) {
        if (Math.max(Math.abs(dx), Math.abs(dz)) !== r) continue;
        if (!w.getChunk(pcx + dx, pcz + dz)) {
          w.ensureChunk(pcx + dx, pcz + dz);
          budget--;
        }
      }
    }
    Renderer.updateChunkMeshes(w, p.x, p.z, rd);
  },
  render(dt) {
    const p = this.player, w = this.world;
    // camera with view bob (shared with aim raycasts via p.eyePos())
    const eye = p.eyePos();
    // fov: sprint & bow
    let fov = this.fov;
    if (p.sprinting) fov += 8;
    if (p.bowCharge >= 0) fov -= p.bowCharge * 12;
    this.curFovSmooth = lerp(this.curFovSmooth || fov, fov, dt * 10);
    Renderer.curFov = this.curFovSmooth;
    Renderer.beginFrame(eye[0], eye[1], eye[2], p.yaw, p.pitch, this.curFovSmooth);
    Renderer.drawChunks(w, this.renderDist);
    drawEntities(w, this, dt);
    // block selection + crack
    if (this.state === 'play' && UI.screen === 'none') {
      const dir = p.lookDir();
      const hit = w.raycast(eye[0], eye[1], eye[2], dir[0], dir[1], dir[2], 4.5);
      if (hit) {
        const box = w.getSelectBox(hit.x, hit.y, hit.z);
        if (box) Renderer.drawSelection(box);
        if (p.mining && p.mining.x === hit.x && p.mining.y === hit.y && p.mining.z === hit.z) {
          const stage = clamp(floor(p.mining.progress * 10), 0, 9);
          Renderer.drawCrack(hit.x, hit.y, hit.z, stage, w);
        }
      }
    }
    Renderer.drawClouds(this.time / 20);
    Renderer.drawWater();
    Particles.draw(w);
    Weather.draw(w);
    this.drawViewModel(dt);
    this.chunkUpdates = 0;
  },
  drawViewModel(dt) {
    const p = this.player;
    if (p.deadFlag) return;
    const gl = Renderer.gl;
    Renderer.clearDepth();
    // fixed projection & identity view
    const savedProj = Mat4.copy(Mat4.create(), Renderer.proj);
    const savedView = Mat4.copy(Mat4.create(), Renderer.view);
    Mat4.perspective(Renderer.proj, 62 * DEG, Renderer.canvas.width / Renderer.canvas.height, 0.05, 8);
    Mat4.identity(Renderer.view);
    const l = this.world.getLightPacked(floor(p.x), floor(clamp(p.eyeY(), 0, 127)), floor(p.z));
    const light = [(l >> 4) / 15, (l & 15) / 15];
    const held = p.heldItem();
    const swing = p.swing;
    const swingRot = Math.sin(swing * Math.PI) * 1.1;
    const swingDip = Math.sin(swing * Math.PI * 2) * 0.12;
    const bob = this.options.bob ? Math.sin(p.bobT) * 0.012 * p.bobAmp : 0;
    const bobY2 = this.options.bob ? Math.abs(Math.cos(p.bobT)) * 0.014 * p.bobAmp : 0;
    const eat = p.eating > 0 ? Math.abs(Math.sin(p.eating * 18)) * 0.1 : 0;
    // anchor the view model to the bottom-right corner regardless of window aspect
    const hw = Math.tan(31 * DEG) * (Renderer.canvas.width / Renderer.canvas.height);
    const m = Mat4.create();
    if (held && Items[held.id].block !== undefined) {
      Mat4.translate(m, hw * 0.75 * 0.62 + bob, -0.55 + bobY2 - swingDip + eat * 0.3, -0.75);
      Mat4.rotY(m, 0.42 - swingRot * 0.35);
      Mat4.rotX(m, -swingRot * 0.5);
      Mat4.scale(m, 0.42, 0.42, 0.42);
      Renderer.drawGeo(Renderer.getMiniBlock(Items[held.id].block), m, light, Renderer.atlasTex);
    } else if (held) {
      let tex = Items[held.id].icon || 'missing';
      if (held.id === 'bow' && p.bowCharge >= 0) {
        tex = 'i_bow_pull_' + Math.min(2, floor(p.bowCharge * 3));
      }
      // classic MC tool pose: big diagonal sprite at the bottom-right
      Mat4.translate(m, hw * 0.72 * 0.62 + bob, -0.32 + bobY2 - swingDip + eat, -0.72);
      Mat4.rotX(m, 0.05 - swingRot * 0.6 - eat * 2.4);
      Mat4.rotY(m, 0.5);
      Mat4.rotZ(m, -0.55 + swingRot * 0.7);
      Mat4.scale(m, 0.85, 0.85, 0.85);
      Renderer.drawGeo(Renderer.getSprite(tex), m, light, Renderer.atlasTex);
    } else {
      // bare arm — vanilla MC first-person pose: hand cap at lower-right of center,
      // arm running diagonally (~45°) off the bottom-right corner, rolled so the
      // inner face + front face are both visible (chunky 3/4 view), leaning to camera.
      // Pose values live in this.armPose so they can be tuned live without a reload.
      const A = this.armPose;
      const edge = hw * 0.72; // half frustum width at the arm's depth
      // base anchor + rotation (no swing baked in here, so re-tuning the pose never
      // fights with the punch animation below)
      Mat4.translate(m, edge * A.posX + bob, A.posY + bobY2 - swingDip * 0.8, A.posZ);
      Mat4.rotZ(m, A.rotZ);
      Mat4.rotY(m, A.rotY);
      Mat4.rotX(m, A.rotX);
      // punch swing — PURE rotation around the shoulder pivot (top of the arm box) so the
      // fist arcs up and inward toward the crosshair and swings back. No axial translation,
      // so the tuned resting pose never slides out of frame: the hand stays put, only the
      // animation moves. At rest (swing == 1) arc == 0, so we land exactly on the base pose.
      const arc = Math.sin(Math.sqrt(swing) * Math.PI); // 0 → 1 → 0, snappy out / soft return
      Mat4.rotX(m, arc * 1.0);   // main hinge: fist arcs up and inward toward the crosshair
      Mat4.rotZ(m, arc * -0.2);  // slight roll so the arc reads natural
      Mat4.translate(m, 0, 0, arc * -0.12); // a touch of forward reach into the punch
      Mat4.scale(m, A.scale, A.scale, A.scale);
      // draw arm box directly
      Renderer.drawMob({ type: 'steve_arm', model: 'steve_arm' }, [m], light, 0);
    }
    Mat4.copy(Renderer.proj, savedProj);
    Mat4.copy(Renderer.view, savedView);
  },
};

// ---------- nether portal construction ----------
const Portals = {
  tryIgnite(world, x, y, z) {
    // x,y,z = air spot where fire would go; look for surrounding obsidian frame
    for (const axis of ['x', 'z']) {
      const res = this.findFrame(world, x, y, z, axis);
      if (res) {
        for (let h = 0; h < res.h; h++) for (let wi = 0; wi < res.w; wi++) {
          const px = axis === 'x' ? res.x0 + wi : res.x0;
          const pz = axis === 'z' ? res.z0 + wi : res.z0;
          world.setBlock(px, res.y0 + h, pz, B.NETHER_PORTAL, 0, { noUpdate: true });
        }
        Sfx.play('portalTravel', { vol: 0.7, pos: [x, y, z] });
        return true;
      }
    }
    return false;
  },
  findFrame(world, x, y, z, axis) {
    const dx = axis === 'x' ? 1 : 0, dz = axis === 'z' ? 1 : 0;
    const at = (px, py, pz) => world.getBlock(px, py, pz);
    const empty = id => id === B.AIR || id === B.FIRE;
    // descend to bottom
    let by = y;
    while (by > 1 && empty(at(x, by - 1, z))) by--;
    if (at(x, by - 1, z) !== B.OBSIDIAN) return null;
    // find left edge
    let x0 = x, z0 = z, steps = 0;
    while (steps++ < 21 && empty(at(x0 - dx, by, z0 - dz))) { x0 -= dx; z0 -= dz; }
    if (at(x0 - dx, by, z0 - dz) !== B.OBSIDIAN) return null;
    // width
    let w = 0;
    while (w < 21 && empty(at(x0 + dx * w, by, z0 + dz * w))) w++;
    if (w < 2 || w > 21) return null;
    if (at(x0 + dx * w, by, z0 + dz * w) !== B.OBSIDIAN) return null;
    // height
    let h = 0;
    outer: while (h < 21) {
      for (let i = 0; i < w; i++) {
        if (!empty(at(x0 + dx * i, by + h, z0 + dz * i))) break outer;
      }
      h++;
    }
    if (h < 3 || h > 21) return null;
    // verify frame: top row + bottom row + sides
    for (let i = 0; i < w; i++) {
      if (at(x0 + dx * i, by - 1, z0 + dz * i) !== B.OBSIDIAN) return null;
      if (at(x0 + dx * i, by + h, z0 + dz * i) !== B.OBSIDIAN) return null;
    }
    for (let j = 0; j < h; j++) {
      if (at(x0 - dx, by + j, z0 - dz) !== B.OBSIDIAN) return null;
      if (at(x0 + dx * w, by + j, z0 + dz * w) !== B.OBSIDIAN) return null;
    }
    return { x0, z0, y0: by, w, h, axis };
  },
  findOrCreate(world, tx, tz) {
    // ensure area
    for (let dx = -1; dx <= 1; dx++) for (let dz = -1; dz <= 1; dz++) world.ensureChunk((tx >> 4) + dx, (tz >> 4) + dz);
    // search existing portal blocks within 24 blocks
    for (let r = 0; r < 24; r += 4) {
      for (let dx = -r; dx <= r; dx += 2) for (let dz = -r; dz <= r; dz += 2) {
        if (!world.isLoaded(tx + dx, tz + dz)) continue;
        for (let y = 10; y < 120; y++) {
          if (world.getBlock(tx + dx, y, tz + dz) === B.NETHER_PORTAL) {
            return [tx + dx, y, tz + dz];
          }
        }
      }
    }
    // build a new portal: find a spot with solid ground and air
    let bx = tx, by = 64, bz = tz, found = false;
    for (let r = 0; r < 16 && !found; r += 2) {
      for (let dx = -r; dx <= r && !found; dx += 2) for (let dz = -r; dz <= r && !found; dz += 2) {
        const px = tx + dx, pz = tz + dz;
        const lo = world.dim === 'nether' ? 34 : 30, hi = world.dim === 'nether' ? 96 : 110;
        for (let y = lo; y < hi; y++) {
          const g = world.getBlock(px, y - 1, pz);
          if (Blocks[g].solid && world.getBlock(px, y, pz) === B.AIR && world.getBlock(px, y + 1, pz) === B.AIR && world.getBlock(px, y + 2, pz) === B.AIR) {
            bx = px; by = y; bz = pz; found = true;
            break;
          }
        }
      }
    }
    if (!found) {
      by = world.dim === 'nether' ? 64 : Math.max(SEA + 1, 64);
      // carve a pocket
      for (let dx = -2; dx <= 3; dx++) for (let dy = -1; dy <= 5; dy++) for (let dz = -2; dz <= 2; dz++) {
        world.setBlock(bx + dx, by + dy, bz + dz, dy === -1 ? (world.dim === 'nether' ? B.NETHERRACK : B.STONE) : B.AIR);
      }
    }
    // frame along x
    for (let i = -1; i <= 2; i++) {
      world.setBlock(bx + i, by - 1, bz, B.OBSIDIAN);
      world.setBlock(bx + i, by + 3, bz, B.OBSIDIAN);
    }
    for (let j = 0; j < 3; j++) {
      world.setBlock(bx - 1, by + j, bz, B.OBSIDIAN);
      world.setBlock(bx + 2, by + j, bz, B.OBSIDIAN);
      world.setBlock(bx, by + j, bz, B.NETHER_PORTAL, 0, { noUpdate: true });
      world.setBlock(bx + 1, by + j, bz, B.NETHER_PORTAL, 0, { noUpdate: true });
      // clear front/back
      world.setBlock(bx, by + j, bz - 1, B.AIR); world.setBlock(bx + 1, by + j, bz - 1, B.AIR);
      world.setBlock(bx, by + j, bz + 1, B.AIR); world.setBlock(bx + 1, by + j, bz + 1, B.AIR);
    }
    // floor
    for (let i = 0; i <= 1; i++) for (const dz of [-1, 1]) {
      if (!Blocks[world.getBlock(bx + i, by - 1, bz + dz)].solid) world.setBlock(bx + i, by - 1, bz + dz, B.OBSIDIAN);
    }
    return [bx, by, bz];
  },
};

// ---------- debug API ----------
window.MC = {
  get game() { return Game; },
  get player() { return Game.player; },
  get world() { return Game.world; },
  give(id, n = 1) {
    if (!Items[id]) return 'unknown item: ' + id;
    Game.player.inventory.add(mkStack(id, n));
    return 'gave ' + n + ' ' + id;
  },
  tp(x, y, z) { const p = Game.player; p.x = x; p.y = y; p.z = z; p.fallStart = y; p.vx = p.vy = p.vz = 0; return 'tp ok'; },
  time(t) { Game.time = t; return Game.time; },
  weather(s, dur) { Weather.set(s, dur); return 'weather: ' + Weather.state; },
  dim(name) {
    if (name === 'nether' || name === 'end' || name === 'overworld') {
      const p = Game.player;
      Game.switchDim(Game.dims[name], p.x, p.y, p.z, () => {
        if (name === 'end') {
          Game.player.x = 70.5; Game.player.y = 52; Game.player.z = 0.5;
          if (!Game.dragonKilled && !Game.dims.end.entities.some(e => e.type === 'dragon')) spawnMob(Game.dims.end, 'dragon', 0, 90, 0);
        } else {
          // find safe y
          const w = Game.world;
          for (let y = 100; y > 5; y--) {
            if (Blocks[w.getBlock(floor(p.x), y, floor(p.z))].solid) { p.y = y + 1.1; break; }
          }
        }
      }, 'Teleporting');
    }
    return 'ok';
  },
  spawn(type, n = 1) {
    const p = Game.player;
    const dir = p.lookDir();
    for (let i = 0; i < n; i++) spawnMob(Game.world, type, p.x + dir[0] * 5, p.y + 1, p.z + dir[2] * 5);
    return 'spawned';
  },
  look(yaw, pitch) { Game.player.yaw = yaw; Game.player.pitch = pitch; return 'ok'; },
  key(k, down) { Game.player.keys[k] = down; return 'ok'; },
  click(btn) { if (btn === 'left') Game.player.attackPress(); else Game.player.usePress(); return 'ok'; },
  fly() { Game.player.fly = !Game.player.fly; return 'fly: ' + Game.player.fly; },
  heal() { const p = Game.player; p.hp = 20; p.hunger = 20; return 'ok'; },
  stronghold() { return [Gen.strongholdX, Gen.strongholdZ]; },
  fortress() { const f = Gen.nearestFortress(Game.player.x, Game.player.z); return f ? [f.cx, f.cz] : null; },
  state() {
    const p = Game.player;
    return {
      state: Game.state, screen: UI.screen, dim: Game.world ? Game.world.dim : null,
      pos: p ? [Math.round(p.x * 10) / 10, Math.round(p.y * 10) / 10, Math.round(p.z * 10) / 10] : null,
      hp: p ? p.hp : null, hunger: p ? p.hunger : null, time: Math.round(Game.time),
      entities: Game.world ? Game.world.entities.length : 0,
      chunks: Game.world ? Game.world.chunks.size : 0,
      fps: Game.fps,
    };
  },
  newWorld(seed) { Game.newWorld(seed === undefined ? '' : '' + seed); return 'ok'; },
  title() { Game.toTitle(); return 'ok'; },
  clickAt(x, y) { UI.mx = x; UI.my = y; UI.onMouseDown(0, false); return 'ok'; },
  buttons() { return UI.buttons.map(b => b.id + '@' + b.x + ',' + b.y); },
};

window.addEventListener('load', () => Game.init());

</script>
