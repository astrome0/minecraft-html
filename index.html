'use strict';
// ============ chat.js — T chat, slash commands, tab-complete suggestions ============

// ---------- command registry ----------
const Commands = {
  defs: {
    help: {
      usage: '/help', desc: 'Show all commands',
      run() {
        for (const k of Object.keys(Commands.defs)) {
          const d = Commands.defs[k];
          UI.msg(d.usage + ' - ' + d.desc, '#aaaaaa');
        }
      },
    },
    give: {
      usage: '/give [player] <item> [count]', desc: 'Give items',
      complete(i, t) {
        const itemFirst = t[0] && Items[t[0]];
        if (i === 0) return ['@p', '@a', 'player'].concat(Commands.itemIds());
        if (i === 1) return itemFirst ? ['1', '16', '64'] : Commands.itemIds();
        if (i === 2) return itemFirst ? [] : ['1', '16', '64'];
        return [];
      },
      run(a) {
        if (!a.length) { UI.msg('Usage: ' + this.usage, '#ff5555'); return; }
        let who = 'player', rest = a;
        if (!Items[a[0]] && rest.length > 1) { who = a[0]; rest = a.slice(1); }
        const id = rest[0];
        if (!id || !Items[id]) { UI.msg('Unknown item: ' + (id || a[0]), '#ff5555'); return; }
        let n = rest[1] !== undefined ? parseInt(rest[1]) : 1;
        if (isNaN(n)) { UI.msg('Invalid count: ' + rest[1], '#ff5555'); return; }
        n = clamp(n, 1, 6400);
        const p = Game.player;
        let left = n;
        while (left > 0) {
          const take = Math.min(left, Items[id].stack || 64);
          const st = mkStack(id, take);
          if (p.inventory.add(st) > 0) spawnItemEntity(Game.world, p.x, p.y + 1, p.z, st, true);
          left -= take;
        }
        UI.msg('Gave ' + n + ' [' + (Items[id].label || id) + '] to ' + who);
        Sfx.play('pop');
      },
    },
    tp: {
      usage: '/tp <x> <y> <z>', desc: 'Teleport (~ = relative)',
      complete() { return ['~']; },
      run(a) {
        if (a.length < 3) { UI.msg('Usage: ' + this.usage, '#ff5555'); return; }
        const p = Game.player;
        const rel = (tok, cur) => {
          if (tok === '~') return cur;
          if (tok[0] === '~') { const d = parseFloat(tok.slice(1)); return isNaN(d) ? NaN : cur + d; }
          return parseFloat(tok);
        };
        const x = rel(a[0], p.x), y = rel(a[1], p.y), z = rel(a[2], p.z);
        if (isNaN(x) || isNaN(y) || isNaN(z)) { UI.msg('Invalid coordinates', '#ff5555'); return; }
        p.x = x; p.y = clamp(y, 1, 126); p.z = z;
        p.vx = p.vy = p.vz = 0; p.fallStart = p.y;
        UI.msg('Teleported to ' + Math.round(x) + ' ' + Math.round(p.y) + ' ' + Math.round(z));
      },
    },
    fill: {
      usage: '/fill <x1 y1 z1> <x2 y2 z2> <block> [replace|keep|hollow|outline|destroy]', desc: 'Fill a region with a block',
      complete(i) {
        if (i < 6) return ['~'];
        if (i === 6) return Object.keys(Items).filter(k => Items[k].block !== undefined).concat('air').sort();
        if (i === 7) return ['replace', 'keep', 'hollow', 'outline', 'destroy'];
        return [];
      },
      run(a) {
        if (a.length < 7) { UI.msg('Usage: ' + this.usage, '#ff5555'); return; }
        const p = Game.player, w = Game.world;
        const rel = (tok, cur) => {
          if (tok === '~') return floor(cur);
          if (tok[0] === '~') { const d = parseFloat(tok.slice(1)); return isNaN(d) ? NaN : floor(cur) + Math.round(d); }
          const n = parseInt(tok); return isNaN(n) ? NaN : n;
        };
        const c = [rel(a[0], p.x), rel(a[1], p.y), rel(a[2], p.z), rel(a[3], p.x), rel(a[4], p.y), rel(a[5], p.z)];
        if (c.some(isNaN)) { UI.msg('Invalid coordinates', '#ff5555'); return; }
        const name = a[6].toLowerCase();
        let id = null;
        if (name === 'air') id = B.AIR;
        else if (Items[name] && Items[name].block !== undefined) id = Items[name].block;
        else { for (const b of Blocks) if (b && b.name === name) { id = b.id; break; } }
        if (id === null) { UI.msg('Unknown block: ' + name, '#ff5555'); return; }
        const mode = (a[7] || 'replace').toLowerCase();
        if (!['replace', 'keep', 'hollow', 'outline', 'destroy'].includes(mode)) { UI.msg('Unknown mode: ' + mode, '#ff5555'); return; }
        const lox = Math.min(c[0], c[3]), hix = Math.max(c[0], c[3]);
        const loy = clamp(Math.min(c[1], c[4]), 0, 127), hiy = clamp(Math.max(c[1], c[4]), 0, 127);
        const loz = Math.min(c[2], c[5]), hiz = Math.max(c[2], c[5]);
        const vol = (hix - lox + 1) * (hiy - loy + 1) * (hiz - loz + 1);
        if (vol > 32768) { UI.msg('Too many blocks (' + vol + ', max 32768)', '#ff5555'); return; }
        let n = 0;
        for (let x = lox; x <= hix; x++) for (let y = loy; y <= hiy; y++) for (let z = loz; z <= hiz; z++) {
          const edge = x === lox || x === hix || y === loy || y === hiy || z === loz || z === hiz;
          let placeId = id, doPlace = true;
          if (mode === 'keep') doPlace = w.getBlock(x, y, z) === B.AIR;
          else if (mode === 'outline') doPlace = edge;
          else if (mode === 'hollow') placeId = edge ? id : B.AIR;
          if (doPlace) { w.setBlock(x, y, z, placeId, 0); n++; }
        }
        UI.msg(n ? ('Filled ' + n + ' block' + (n === 1 ? '' : 's')) : 'No blocks filled');
      },
    },
    time: {
      usage: '/time set <day|noon|night|midnight|N>', desc: 'Set time of day',
      complete(i, t) {
        if (i === 0) return ['set', 'add'];
        if (i === 1) return t[0] === 'add' ? ['1000', '6000', '12000'] : ['day', 'noon', 'night', 'midnight'];
        return [];
      },
      run(a) {
        const NAMED = { day: 1000, noon: 6000, sunset: 12000, night: 13000, midnight: 18000 };
        let mode = 'set', val = a[0];
        if (a[0] === 'set' || a[0] === 'add') { mode = a[0]; val = a[1]; }
        if (val === undefined) { UI.msg('Usage: ' + this.usage, '#ff5555'); return; }
        const t = NAMED[val] !== undefined ? NAMED[val] : parseInt(val);
        if (isNaN(t)) { UI.msg('Invalid time: ' + val, '#ff5555'); return; }
        if (mode === 'add') Game.time += t;
        else Game.time = Math.floor(Game.time / 24000) * 24000 + ((t % 24000) + 24000) % 24000;
        UI.msg('Time set to ' + Math.floor(Game.time % 24000));
      },
    },
    spawn: {
      usage: '/spawn <mob> [count]', desc: 'Spawn a mob',
      complete(i) {
        if (i === 0) return Object.keys(MOB_CLASSES).sort();
        if (i === 1) return ['1', '2', '5', '10'];
        return [];
      },
      run(a) {
        const type = a[0];
        if (!type || !MOB_CLASSES[type]) { UI.msg('Unknown mob: ' + (type || '(none)'), '#ff5555'); return; }
        const n = clamp(parseInt(a[1] || '1') || 1, 1, 20);
        const p = Game.player, dir = p.lookDir();
        for (let i = 0; i < n; i++) spawnMob(Game.world, type, p.x + dir[0] * 4, p.y + 1, p.z + dir[2] * 4);
        UI.msg('Spawned ' + n + ' ' + type);
      },
    },
    kill: {
      usage: '/kill', desc: 'Kill yourself',
      run() { const p = Game.player; p.hp = 0; p.die(); UI.msg('Ouch! That looks like it hurt'); },
    },
    heal: {
      usage: '/heal', desc: 'Restore health and hunger',
      run() {
        const p = Game.player;
        p.hp = p.maxHp; p.hunger = 20; p.saturation = 5; p.air = 15; p.fireT = 0;
        UI.msg('Restored health and hunger');
      },
    },
    clear: {
      usage: '/clear', desc: 'Clear your inventory',
      run() {
        const inv = Game.player.inventory;
        let n = 0;
        for (let i = 0; i < 36; i++) if (inv.slots[i]) { n += inv.slots[i].n; inv.slots[i] = null; }
        for (let i = 0; i < 4; i++) if (inv.armor[i]) { n += inv.armor[i].n; inv.armor[i] = null; }
        UI.msg(n ? 'Cleared ' + n + ' items' : 'Inventory is already empty');
      },
    },
    seed: {
      usage: '/seed', desc: 'Show the world seed',
      run() { UI.msg('Seed: ' + Game.seed); },
    },
    fly: {
      usage: '/fly', desc: 'Toggle flying',
      run() { const p = Game.player; p.fly = !p.fly; UI.msg('Flying: ' + (p.fly ? 'ON' : 'OFF')); },
    },
    weather: {
      usage: '/weather <clear|rain|thunder> [seconds]', desc: 'Set the weather',
      complete(i) {
        if (i === 0) return ['clear', 'rain', 'thunder'];
        if (i === 1) return ['30', '300', '600'];
        return [];
      },
      run(a) {
        if (Game.world && Game.world.dim !== 'overworld') { UI.msg('There is no weather here', '#ff5555'); return; }
        const s = (a[0] || '').toLowerCase();
        const alias = { clear: 'clear', rain: 'rain', snow: 'rain', thunder: 'thunder', storm: 'thunder' };
        const state = alias[s];
        if (!state) { UI.msg('Usage: ' + this.usage, '#ff5555'); return; }
        let dur;
        if (a[1] !== undefined) { dur = parseFloat(a[1]); if (isNaN(dur)) { UI.msg('Invalid duration: ' + a[1], '#ff5555'); return; } }
        Weather.set(state, dur);
        const label = state === 'clear' ? 'clear' : state === 'thunder' ? 'thunder'
          : (Weather.snowing ? 'snowfall' : 'rain');
        UI.msg('Set the weather to ' + label);
      },
    },
    gamemode: {
      usage: '/gamemode <survival|creative>', desc: 'Change game mode',
      complete(i) { return i === 0 ? ['survival', 'creative'] : []; },
      run(a) {
        const map = { s: 'survival', survival: 'survival', 0: 'survival', c: 'creative', creative: 'creative', 1: 'creative' };
        const m = map[(a[0] || '').toLowerCase()];
        if (!m) { UI.msg('Usage: ' + this.usage, '#ff5555'); return; }
        Game.mode = m;
        if (m === 'survival') Game.player.fly = false;
        UI.msg('Set own game mode to ' + m[0].toUpperCase() + m.slice(1) + ' Mode');
      },
    },
  },
  _itemIds: null,
  itemIds() { return this._itemIds || (this._itemIds = Object.keys(Items).sort()); },
  run(text) {
    const parts = text.slice(1).trim().split(/\s+/);
    const name = (parts[0] || '').toLowerCase();
    const cmd = this.defs[name];
    if (!cmd) { UI.msg('Unknown command: /' + name + ' (try /help)', '#ff5555'); return; }
    try { cmd.run(parts.slice(1)); }
    catch (err) { UI.msg('Command error: ' + err.message, '#ff5555'); }
  },
};

// ---------- chat overlay ----------
const Chat = {
  open: false,
  input: '',
  sent: [],       // command/message history (newest last)
  histIdx: -1,    // -1 = editing new line
  suggestions: [],
  sugIdx: 0,
  sugStart: 0,    // char index in input where the token being completed starts
  cursorT: 0,

  openChat(prefill) {
    if (Game.state !== 'play' || UI.screen !== 'none') return;
    this.open = true;
    this.input = prefill || '';
    this.histIdx = -1;
    this.cursorT = 0;
    // stop all movement so the player doesn't keep walking while typing
    const K = Game.player.keys;
    K.fwd = K.back = K.left = K.right = K.jump = K.sneak = K.sprint = K.attack = K.use = false;
    Game.releasePointer();
    this.updateSuggestions();
  },
  close() {
    this.open = false;
    this.input = '';
    this.suggestions = [];
    if (Game.state === 'play' && UI.screen === 'none') Game.requestPointer();
  },
  submit() {
    const text = this.input.trim();
    if (text) {
      if (this.sent[this.sent.length - 1] !== text) this.sent.push(text);
      if (this.sent.length > 32) this.sent.shift();
      if (text[0] === '/') Commands.run(text);
      else UI.msg('<Player> ' + text);
    }
    this.close();
  },
  onKey(e) {
    const code = e.code;
    if (code === 'Escape') { this.close(); return; }
    if (code === 'Enter' || code === 'NumpadEnter') { this.submit(); return; }
    if (code === 'Backspace') {
      this.input = this.input.slice(0, -1);
      this.updateSuggestions();
      return;
    }
    if (code === 'Tab') { this.completeSelected(); return; }
    if (code === 'ArrowUp') {
      if (this.suggestions.length > 1) this.sugIdx = (this.sugIdx - 1 + this.suggestions.length) % this.suggestions.length;
      else this.histNav(1);
      return;
    }
    if (code === 'ArrowDown') {
      if (this.suggestions.length > 1) this.sugIdx = (this.sugIdx + 1) % this.suggestions.length;
      else this.histNav(-1);
      return;
    }
    if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey && this.input.length < 100) {
      this.input += e.key;
      this.updateSuggestions();
    }
  },
  histNav(dir) {
    if (!this.sent.length) return;
    this.histIdx = clamp(this.histIdx + dir, -1, this.sent.length - 1);
    this.input = this.histIdx === -1 ? '' : this.sent[this.sent.length - 1 - this.histIdx];
    this.updateSuggestions();
  },
  updateSuggestions() {
    this.suggestions = [];
    this.sugIdx = 0;
    this.sugStart = 0;
    const inp = this.input;
    if (inp[0] !== '/') return;
    const toks = inp.slice(1).split(' ');
    const last = toks[toks.length - 1].toLowerCase();
    if (toks.length === 1) {
      // completing the command name itself
      this.suggestions = Object.keys(Commands.defs).sort()
        .filter(c => c.startsWith(last)).map(c => '/' + c);
    } else {
      const def = Commands.defs[toks[0].toLowerCase()];
      if (!def || !def.complete) return;
      const args = toks.slice(1);
      const cands = def.complete(args.length - 1, args) || [];
      this.sugStart = inp.lastIndexOf(' ') + 1;
      this.suggestions = cands.filter(c => c.toLowerCase().startsWith(last)).slice(0, 60);
    }
  },
  completeSelected() {
    if (!this.suggestions.length) return;
    const s = this.suggestions[this.sugIdx];
    const isCmd = this.sugStart === 0;
    this.input = this.input.slice(0, this.sugStart) + s + (isCmd ? ' ' : '');
    this.updateSuggestions();
  },

  draw(ui, dt) {
    this.cursorT += dt;
    const W = ui.W(), H = ui.H();
    const iy = H - 16;
    // recent chat history — solid while chat is open
    const msgs = UI.messages;
    for (let i = 0; i < msgs.length; i++) {
      const m = msgs[msgs.length - 1 - i];
      const y = iy - 12 - i * 10;
      if (y < 2) break;
      ui.rect(2, y - 1, Font.width(m.text) + 4, 10, 'rgba(0,0,0,0.55)');
      ui.text(m.text, 4, y, m.color || '#ffffff');
    }
    // input bar
    ui.rect(2, iy, W - 4, 12, 'rgba(0,0,0,0.55)');
    const cur = ((this.cursorT * 2.5) | 0) % 2 === 0 ? '_' : '';
    ui.text(this.input + cur, 4, iy + 2, '#ffffff');
    // suggestion popup (grey box above the input, like vanilla)
    if (this.suggestions.length) {
      const maxShow = 10;
      let first = 0;
      if (this.suggestions.length > maxShow) {
        first = clamp(this.sugIdx - ((maxShow / 2) | 0), 0, this.suggestions.length - maxShow);
      }
      const rows = this.suggestions.slice(first, first + maxShow);
      let bw = 0;
      for (const r of rows) bw = Math.max(bw, Font.width(r));
      const sx = 4 + Font.width(this.input.slice(0, this.sugStart));
      const bx = clamp(sx - 2, 2, Math.max(2, W - bw - 8));
      const bh = rows.length * 10 + 3;
      const by = iy - bh - 1;
      ui.rect(bx, by, bw + 6, bh, 'rgba(0,0,0,0.72)');
      rows.forEach((r, i) => {
        ui.text(r, bx + 3, by + 2 + i * 10, first + i === this.sugIdx ? '#ffff55' : '#a8a8a8');
      });
      if (this.suggestions.length > maxShow) {
        ui.text((this.sugIdx + 1) + '/' + this.suggestions.length, bx + bw + 8, by + 2, '#666666');
      }
    }
  },
};

// ==== mobile.js ====
'use strict';
// ============ mobile.js — touch controls (Minecraft PE style) ============
// Adds an on-screen joystick + look-drag + fully repositionable buttons so the
// game is playable on a phone/tablet browser (iOS Safari, Android Chrome).
// Uses Pointer Events (multi-touch on phones, mouse on desktop for testing).
//
// Everything Mobile computes is in CANVAS pixels (== CSS px, since UI canvas
// width = window.innerWidth). Menu emulation converts to UI-space (÷ UI.scale)
// to reuse the existing mouse-driven menus.

const Mobile = {
  enabled: false,
  game: null,
  layout: null,               // { opacity, size, crosshair, controls:{ id:{nx,ny} } }
  touchRole: {},              // pointerId -> role string
  stickId: null, knobX: 0, knobY: 0,
  lookId: null, lookX: 0, lookY: 0,
  sprintOn: false,
  active: {},                 // control id -> true (pressed/toggled) for highlight
  lastJump: 0,
  dragCtrl: null, dragId: null,
  creativeAcc: 0,
  slot: null, _slotTimer: null,
  kbEl: null, kbTarget: null,

  // ---- control definitions: default normalized position + look/behaviour ----
  // nx,ny are fractions of the canvas (0..1). rmul scales the base radius.
  DEFS: {
    move:   { nx: 0.135, ny: 0.72, rmul: 1.9, kind: 'stick' },
    jump:   { nx: 0.905, ny: 0.80, rmul: 1.15, kind: 'hold', glyph: 'up' },
    sneak:  { nx: 0.775, ny: 0.885, rmul: 1.0, kind: 'hold', glyph: 'down' },
    sprint: { nx: 0.665, ny: 0.72, rmul: 1.0, kind: 'toggle', glyph: 'run' },
    break:  { nx: 0.905, ny: 0.53, rmul: 1.15, kind: 'hold', glyph: 'mine' },
    use:    { nx: 0.775, ny: 0.66, rmul: 1.0, kind: 'hold', glyph: 'use' },
    inv:    { nx: 0.955, ny: 0.10, rmul: 0.95, kind: 'tap', glyph: 'bag' },
    drop:   { nx: 0.865, ny: 0.10, rmul: 0.95, kind: 'tap', glyph: 'drop' },
    fly:    { nx: 0.775, ny: 0.10, rmul: 0.95, kind: 'toggle', glyph: 'fly', creative: true },
    pause:  { nx: 0.045, ny: 0.09, rmul: 0.85, kind: 'tap', glyph: 'pause' },
    chat:   { nx: 0.135, ny: 0.09, rmul: 0.85, kind: 'tap', glyph: 'chat' },
  },
  BASE_R: 34,   // base button radius in CSS px (before rmul * layout.size)

  order() {
    // draw/hit order (later = on top); pause & utility first, action buttons last
    return ['move', 'pause', 'chat', 'inv', 'drop', 'fly', 'sprint', 'sneak', 'use', 'break', 'jump'];
  },

  defaultLayout() {
    const controls = {};
    for (const id in this.DEFS) controls[id] = { nx: this.DEFS[id].nx, ny: this.DEFS[id].ny };
    return { opacity: 0.55, size: 1.0, crosshair: true, controls };
  },

  init(game) {
    this.game = game;
    // detection: coarse pointer / touch device, or forced via query / saved pref
    let forced = null;
    try {
      const q = new URLSearchParams(location.search);
      if (q.has('touch')) forced = q.get('touch') !== '0';
    } catch (e) {}
    let saved = null;
    try { const s = localStorage.getItem('mcpe_touch_on'); if (s != null) saved = s === '1'; } catch (e) {}
    const auto = (window.matchMedia && matchMedia('(pointer:coarse)').matches) ||
      ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
    this.enabled = forced != null ? forced : (saved != null ? saved : auto);

    this.loadLayout();

    // Pointer events on window so drags that leave the canvas still track.
    window.addEventListener('pointerdown', (e) => this.onDown(e), { passive: false });
    window.addEventListener('pointermove', (e) => this.onMove(e), { passive: false });
    window.addEventListener('pointerup', (e) => this.onUp(e), { passive: false });
    window.addEventListener('pointercancel', (e) => this.onUp(e), { passive: false });
    const cv = document.getElementById('ui');
    if (cv) cv.style.touchAction = 'none';
  },
  setEnabled(on) {
    this.enabled = on;
    try { localStorage.setItem('mcpe_touch_on', on ? '1' : '0'); } catch (e) {}
    if (!on) this.releaseAll();
  },

  loadLayout() {
    this.layout = this.defaultLayout();
    try {
      const o = JSON.parse(localStorage.getItem('mcpe_touch_layout'));
      if (o) {
        if (typeof o.opacity === 'number') this.layout.opacity = o.opacity;
        if (typeof o.size === 'number') this.layout.size = o.size;
        if (typeof o.crosshair === 'boolean') this.layout.crosshair = o.crosshair;
        if (o.controls) for (const id in this.layout.controls) {
          if (o.controls[id]) Object.assign(this.layout.controls[id], o.controls[id]);
        }
      }
    } catch (e) {}
  },
  save() { try { localStorage.setItem('mcpe_touch_layout', JSON.stringify(this.layout)); } catch (e) {} },
  resetLayout() { this.layout = this.defaultLayout(); this.save(); },

  // ---- geometry ----
  cw() { return UI.canvas.width; },
  ch() { return UI.canvas.height; },
  cpos(id) {
    const d = this.DEFS[id], l = this.layout.controls[id];
    const r = this.BASE_R * d.rmul * this.layout.size * (UI.scale >= 3 ? 1.25 : UI.scale >= 2 ? 1.1 : 1);
    return { x: l.nx * this.cw(), y: l.ny * this.ch(), r };
  },
  visible(id) {
    if (this.DEFS[id].creative && (!this.game || this.game.mode !== 'creative')) return false;
    return true;
  },

  // ---- routing ----
  inPlay() {
    const g = this.game;
    return g && g.state === 'play' && UI.screen === 'none' && !(typeof Chat !== 'undefined' && Chat.open);
  },
  onDown(e) {
    if (!this.enabled) return;
    if (typeof Sfx !== 'undefined') Sfx.ensure();
    const id = e.pointerId, x = e.clientX, y = e.clientY;
    if (UI.screen === 'touchedit') { e.preventDefault(); this.editorStart(id, x, y); return; }
    if (!this.inPlay()) { e.preventDefault(); this.menuStart(id, x, y); return; }
    e.preventDefault();
    this.playStart(id, x, y);
  },
  onMove(e) {
    if (!this.enabled) return;
    const id = e.pointerId;
    const role = this.touchRole[id];
    if (role === undefined) return;   // ignore untracked (e.g. desktop mouse hover)
    const x = e.clientX, y = e.clientY;
    e.preventDefault();
    if (role === 'move') this.stickVec(x, y);
    else if (role === 'look') this.lookMove(x, y);
    else if (role === 'editor') this.editorMove(id, x, y);
    else if (role === 'menu') this.menuMove(x, y);
    else if (role === 'slotmenu') this.slotMenuMove(x, y);
  },
  slotMenuMove(x, y) {
    if (this.slot && Math.hypot(x - this.slot.x, y - this.slot.y) > 10) {
      this.slot.moved = true; clearTimeout(this._slotTimer);
    }
  },
  onUp(e) {
    if (!this.enabled) return;
    const id = e.pointerId;
    const role = this.touchRole[id];
    if (role === undefined) return;
    delete this.touchRole[id];
    if (role === 'move') { this.stickId = null; this.clearMove(); }
    else if (role === 'look') { this.lookId = null; }
    else if (role === 'editor') { this.dragCtrl = null; this.dragId = null; this.save(); }
    else if (role === 'menu') { UI.mouseDown = false; UI.onMouseUp(); }
    else if (role === 'slotmenu') { this.slotMenuEnd(); }
    else if (role.startsWith('btn:')) this.releaseControl(role.slice(4));
  },
  releaseAll() {
    for (const id in this.touchRole) {
      const role = this.touchRole[id];
      if (role && role.startsWith('btn:')) this.releaseControl(role.slice(4));
    }
    this.touchRole = {}; this.stickId = null; this.lookId = null; this.clearMove();
  },

  // ---- play controls ----
  playStart(id, x, y) {
    // hotbar slot select
    const slot = this.hotbarHit(x, y);
    if (slot !== -1) {
      this.game.player.selected = slot;
      UI.showItemName(this.game.player.heldItem());
      this.touchRole[id] = 'hotbar';
      return;
    }
    // close X (only relevant when a menu is up — not in play; skip)
    const ctrl = this.controlAt(x, y);
    if (ctrl === 'move') {
      this.stickId = id; this.touchRole[id] = 'move'; this.stickVec(x, y); return;
    }
    if (ctrl) { this.pressControl(ctrl, id); this.touchRole[id] = 'btn:' + ctrl; return; }
    // else: look drag
    this.lookId = id; this.lookX = x; this.lookY = y; this.touchRole[id] = 'look';
  },
  controlAt(x, y) {
    const ord = this.order();
    for (let i = ord.length - 1; i >= 0; i--) {
      const idc = ord[i];
      if (!this.visible(idc)) continue;
      const c = this.cpos(idc);
      const hit = idc === 'move' ? c.r : c.r * 1.02;
      if ((x - c.x) * (x - c.x) + (y - c.y) * (y - c.y) <= hit * hit) return idc;
    }
    return null;
  },
  stickVec(x, y) {
    const c = this.cpos('move');
    let dx = x - c.x, dy = y - c.y;
    const r = c.r * 0.82; // knob travel radius (fits inside the visible base ring)
    const mag = Math.hypot(dx, dy) || 0.0001;
    if (mag > r) { this.knobX = c.x + dx / mag * r; this.knobY = c.y + dy / mag * r; }
    else { this.knobX = c.x + dx; this.knobY = c.y + dy; }
    const nx = dx / r, ny = dy / r, cl = Math.min(1, mag / r), dead = 0.30;
    const K = this.game.player.keys;
    K.fwd = ny < -dead; K.back = ny > dead;
    K.left = nx < -dead; K.right = nx > dead;
    K.sprint = this.sprintOn || (cl > 0.95 && K.fwd);
  },
  clearMove() {
    if (!this.game || !this.game.player) return;
    const K = this.game.player.keys;
    K.fwd = K.back = K.left = K.right = false;
    K.sprint = this.sprintOn;
  },
  lookMove(x, y) {
    const p = this.game.player;
    if (!p) return;
    const sens = 0.0032 + this.game.options.sens * 0.0075;
    p.yaw += (x - this.lookX) * sens;
    p.pitch = clamp(p.pitch + (y - this.lookY) * sens, -Math.PI / 2 + 0.001, Math.PI / 2 - 0.001);
    this.lookX = x; this.lookY = y;
  },
  pressControl(idc, id) {
    const p = this.game.player, K = p.keys;
    this.active[idc] = true;
    switch (idc) {
      case 'jump': {
        K.jump = true;
        const now = performance.now();
        if (this.game.mode === 'creative' && now - this.lastJump < 300) {
          p.fly = !p.fly; if (p.fly) { p.vy = Math.max(p.vy, 4); p.onGround = false; }
        }
        this.lastJump = now; break;
      }
      case 'sneak': K.sneak = true; break;
      case 'break': K.attack = true; p.attackPress(); break;
      case 'use': K.use = true; p.usePress(); break;
      case 'sprint': this.sprintOn = !this.sprintOn; K.sprint = this.sprintOn; this.active.sprint = this.sprintOn; break;
      case 'fly':
        if (this.game.mode === 'creative') { p.fly = !p.fly; if (p.fly) { p.vy = Math.max(p.vy, 4); p.onGround = false; } this.active.fly = p.fly; }
        else this.active.fly = false;
        break;
      case 'inv': if (UI.screen === 'none') { UI.openInventory(); this.game.achieve && this.game.achieve('inventory'); } this.active.inv = false; break;
      case 'drop': p.dropSelected(false); this.active.drop = false; break;
      case 'pause': UI.screen = 'pause'; this.active.pause = false; this.releaseAll(); break;
      case 'chat':
        this.active.chat = false;
        if (typeof Chat !== 'undefined' && UI.screen === 'none') { Chat.openChat(''); this.openKeyboard('chat'); }
        break;
    }
    if (typeof Sfx !== 'undefined' && (this.DEFS[idc].kind === 'tap' || idc === 'sprint')) Sfx.play('click');
  },
  releaseControl(idc) {
    const K = this.game.player && this.game.player.keys;
    if (!K) return;
    if (this.DEFS[idc] && this.DEFS[idc].kind === 'hold') this.active[idc] = false;
    switch (idc) {
      case 'jump': K.jump = false; break;
      case 'sneak': K.sneak = false; break;
      case 'break': K.attack = false; break;
      case 'use': K.use = false; break;
    }
  },
  hotbarHit(x, y) {
    if (!this.game.player) return -1;
    const s = UI.scale, W = UI.W(), H = UI.H();
    const hx = (W / 2 - 91), hy = (H - 22);
    const y0 = hy * s, h = 22 * s;
    if (y < y0 - 2 * s || y > y0 + h) return -1;
    for (let i = 0; i < 9; i++) {
      const sx = (hx + 1 + i * 20) * s;
      if (x >= sx && x < sx + 20 * s) return i;
    }
    return -1;
  },

  // ---- menu emulation (reuse existing mouse-driven UI) ----
  isSlotScreen(s) { return s === 'inventory' || s === 'crafting' || s === 'furnace' || s === 'chest'; },
  menuStart(id, x, y) {
    // a tap anywhere while chat is up dismisses the keyboard/chat
    if (typeof Chat !== 'undefined' && Chat.open) { this.closeKeyboard(); return; }
    // close (X) button drawn by Mobile when a menu is open
    if (UI.screen !== 'none' && this.closeHit(x, y)) { this.closeMenu(); return; }
    UI.mx = x / UI.scale; UI.my = y / UI.scale;
    this.creativeAcc = 0;
    // inventory/crafting/furnace/chest: tap = left-click (on release), long-press = right-click (split)
    if (this.isSlotScreen(UI.screen)) {
      this.slot = { id, x, y, moved: false, longFired: false };
      this.touchRole[id] = 'slotmenu';
      clearTimeout(this._slotTimer);
      this._slotTimer = setTimeout(() => {
        if (this.touchRole[id] === 'slotmenu' && this.slot && !this.slot.moved) {
          this.slot.longFired = true;
          UI.mx = x / UI.scale; UI.my = y / UI.scale;
          UI.onMouseDown(2, false); // right-click → split stack
          if (typeof Sfx !== 'undefined') Sfx.play('click');
        }
      }, 380);
      return;
    }
    UI.mouseDown = true;
    this.touchRole[id] = 'menu';
    if (this.game.state === 'win') { this.game.skipCredits(); return; }
    UI.onMouseDown(0, false);
    // world-create text fields → pop the iOS keyboard for the tapped field
    if (this.game.state === 'create') {
      for (const b of UI.buttons) {
        if (UI.mx >= b.x && UI.mx < b.x + b.w && UI.my >= b.y && UI.my < b.y + b.h) {
          if (b.id === 'focus_name') this.openKeyboard('name');
          else if (b.id === 'focus_seed') this.openKeyboard('seed');
          break;
        }
      }
    }
  },
  menuMove(x, y) {
    const oldY = UI.my;
    UI.mx = x / UI.scale; UI.my = y / UI.scale;
    // creative page scroll via vertical drag
    if (UI.screen === 'creative') {
      this.creativeAcc += (UI.my - oldY);
      while (Math.abs(this.creativeAcc) >= 12) {
        const dir = this.creativeAcc > 0 ? -1 : 1;
        const max = Math.max(0, Math.ceil((UI.creativeItems || []).length / 9) - 5);
        UI.creativeScroll = clamp((UI.creativeScroll || 0) + dir, 0, max);
        this.creativeAcc -= dir * -12;
      }
    }
  },
  slotMenuEnd() {
    clearTimeout(this._slotTimer);
    if (this.slot && !this.slot.longFired) {
      UI.mx = this.slot.x / UI.scale; UI.my = this.slot.y / UI.scale;
      UI.onMouseDown(0, false); // tap = left-click
    }
    UI.onMouseUp();
    this.slot = null;
  },
  closeHit(x, y) {
    const r = this.closeBtn();
    return (x - r.cx) * (x - r.cx) + (y - r.cy) * (y - r.cy) <= r.r * r.r;
  },
  closeBtn() {
    const s = UI.scale;
    return { cx: this.cw() - 16 * s, cy: 16 * s, r: 11 * s };
  },
  closeMenu() {
    const s = UI.screen;
    if (s === 'pause') return this.game.onButton('resume');
    if (s === 'options') return this.game.onButton('options_done');
    if (s === 'controls') return this.game.onButton('controls_done');
    if (s === 'touchedit') return this.game.onButton('touch_done');
    UI.closeScreen();
  },

  // ---- iOS soft keyboard (hidden <input> so mobile browsers show the keyboard) ----
  ensureKbEl() {
    if (this.kbEl) return this.kbEl;
    const el = document.createElement('input');
    el.type = 'text';
    el.autocomplete = 'off'; el.autocapitalize = 'off'; el.autocorrect = 'off'; el.spellcheck = false;
    // opacity 0 but focusable; 16px font stops iOS zoom; kept near top-left, out of the way
    el.style.cssText = 'position:fixed;top:2px;left:2px;width:120px;height:24px;opacity:0.01;' +
      'border:0;padding:0;margin:0;background:transparent;color:transparent;caret-color:transparent;' +
      'font-size:16px;z-index:5;pointer-events:none;';
    el.addEventListener('input', () => this.onKbInput());
    el.addEventListener('keydown', (e) => this.onKbKeydown(e));
    el.addEventListener('blur', () => this.onKbBlur());
    document.body.appendChild(el);
    this.kbEl = el;
    return el;
  },
  openKeyboard(target) {
    const el = this.ensureKbEl();
    this.kbTarget = target;
    if (target === 'chat') el.value = Chat.input || '';
    else if (target === 'name') el.value = UI.nameInput || '';
    else if (target === 'seed') el.value = UI.seedInput || '';
    el.maxLength = target === 'chat' ? 100 : 24;
    el.setAttribute('enterkeyhint', target === 'chat' ? 'send' : 'done');
    // focus must run inside the same user gesture for iOS to raise the keyboard
    try { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } catch (e) {}
  },
  onKbInput() {
    if (!this.kbTarget) return;
    const v = this.kbEl.value;
    if (this.kbTarget === 'chat') { Chat.input = v.slice(0, 100); Chat.updateSuggestions(); }
    else if (this.kbTarget === 'name') { UI.nameInput = v.slice(0, 24); }
    else if (this.kbTarget === 'seed') { UI.seedInput = v.slice(0, 24); }
  },
  onKbKeydown(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      if (this.kbTarget === 'chat') { Chat.submit(); this.closeKeyboard(); }
      else { const t = this.kbTarget; this.closeKeyboard(); this.game.onButton('create_go'); }
    }
  },
  onKbBlur() {
    if (this.kbTarget === 'chat' && typeof Chat !== 'undefined' && Chat.open) Chat.close();
    this.kbTarget = null;
  },
  closeKeyboard() {
    this.kbTarget = null;
    if (this.kbEl) { try { this.kbEl.blur(); } catch (e) {} }
  },

  // ---- per-frame safety ----
  update() {
    if (!this.enabled || !this.inPlay()) return;
    if (this.stickId === null) this.clearMove();
  },

  // ---- rendering ----
  draw() {
    if (!this.enabled) return;
    const ctx = UI.ctx;
    if (UI.screen === 'touchedit') { this.drawEditor(); return; }
    if (UI.screen !== 'none') { this.drawCloseBtn(); return; }
    if (!this.inPlay()) return;
    ctx.save();
    for (const idc of this.order()) {
      if (!this.visible(idc)) continue;
      this.drawControl(idc, false);
    }
    ctx.restore();
  },
  drawControl(idc, editor) {
    const ctx = UI.ctx, c = this.cpos(idc);
    const op = editor ? 0.85 : this.layout.opacity;
    const on = this.active[idc];
    if (idc === 'move') {
      // base ring
      this.circle(c.x, c.y, c.r, `rgba(0,0,0,${op * 0.35})`, `rgba(255,255,255,${op * 0.55})`, 2 * UI.scale);
      const kx = (this.stickId !== null && !editor) ? this.knobX : c.x;
      const ky = (this.stickId !== null && !editor) ? this.knobY : c.y;
      const kr = c.r * 0.45;
      this.circle(kx, ky, kr, `rgba(230,230,230,${op * 0.7})`, `rgba(255,255,255,${op * 0.9})`, 2 * UI.scale);
    } else {
      const bg = on ? `rgba(150,180,240,${op * 0.85})` : `rgba(30,30,30,${op * 0.6})`;
      this.circle(c.x, c.y, c.r, bg, `rgba(255,255,255,${op * 0.7})`, 2 * UI.scale);
      this.glyph(idc, c.x, c.y, c.r, `rgba(255,255,255,${Math.min(1, op + 0.35)})`);
    }
    if (editor) this.editorLabel(idc, c);
  },
  circle(cx, cy, r, fill, stroke, lw) {
    const ctx = UI.ctx;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = fill; ctx.fill();
    if (stroke) { ctx.lineWidth = lw || 2; ctx.strokeStyle = stroke; ctx.stroke(); }
  },
  glyph(idc, cx, cy, r, color) {
    const ctx = UI.ctx, g = this.DEFS[idc].glyph;
    ctx.save();
    ctx.fillStyle = color; ctx.strokeStyle = color; ctx.lineJoin = 'round';
    const a = r * 0.5;
    if (g === 'up' || g === 'down') {
      const dir = g === 'up' ? -1 : 1;
      ctx.beginPath();
      ctx.moveTo(cx, cy + dir * a * 0.75);
      ctx.lineTo(cx - a * 0.8, cy - dir * a * 0.55);
      ctx.lineTo(cx + a * 0.8, cy - dir * a * 0.55);
      ctx.closePath(); ctx.fill();
    } else if (g === 'run') {
      ctx.lineWidth = Math.max(2, r * 0.13); ctx.lineCap = 'round';
      for (let k = -1; k <= 1; k += 2) {
        ctx.beginPath();
        ctx.moveTo(cx - a * 0.55 + k * a * 0.35, cy - a * 0.55);
        ctx.lineTo(cx + a * 0.35 + k * a * 0.35, cy);
        ctx.lineTo(cx - a * 0.55 + k * a * 0.35, cy + a * 0.55);
        ctx.stroke();
      }
    } else if (g === 'chat') {
      // speech bubble
      ctx.lineWidth = Math.max(2, r * 0.1);
      const w = a * 1.4, h = a * 1.0, x0 = cx - w / 2, y0 = cy - h / 2 - a * 0.15, rad = a * 0.3;
      ctx.beginPath();
      ctx.moveTo(x0 + rad, y0);
      ctx.arcTo(x0 + w, y0, x0 + w, y0 + h, rad);
      ctx.arcTo(x0 + w, y0 + h, x0, y0 + h, rad);
      ctx.arcTo(x0, y0 + h, x0, y0, rad);
      ctx.arcTo(x0, y0, x0 + w, y0, rad);
      ctx.closePath(); ctx.stroke();
      ctx.beginPath(); // tail
      ctx.moveTo(cx - a * 0.15, y0 + h);
      ctx.lineTo(cx - a * 0.35, y0 + h + a * 0.45);
      ctx.lineTo(cx + a * 0.15, y0 + h);
      ctx.fill();
    } else {
      // text glyph via bitmap font
      const map = { mine: 'MINE', use: 'USE', bag: 'BAG', drop: 'DROP', fly: 'FLY', pause: 'II' };
      const t = map[g] || g.toUpperCase();
      const sc = Math.max(1, Math.round(r / 15));
      Font.draw(ctx, t, cx - Font.width(t) * sc / 2, cy - 4 * sc, color, sc, false);
    }
    ctx.restore();
  },
  drawCloseBtn() {
    const r = this.closeBtn(), ctx = UI.ctx;
    this.circle(r.cx, r.cy, r.r, 'rgba(160,40,40,0.85)', 'rgba(255,255,255,0.8)', 2);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = Math.max(2, UI.scale);
    const a = r.r * 0.45;
    ctx.beginPath();
    ctx.moveTo(r.cx - a, r.cy - a); ctx.lineTo(r.cx + a, r.cy + a);
    ctx.moveTo(r.cx + a, r.cy - a); ctx.lineTo(r.cx - a, r.cy + a);
    ctx.stroke();
  },

  // ---- layout editor ----
  editorStart(id, x, y) {
    // close (X)
    if (this.closeHit(x, y)) { this.closeMenu(); return; }
    // control being dragged?
    const ord = this.order();
    for (let i = ord.length - 1; i >= 0; i--) {
      const c = this.cpos(ord[i]);
      if ((x - c.x) * (x - c.x) + (y - c.y) * (y - c.y) <= c.r * c.r) {
        this.dragCtrl = ord[i]; this.dragId = id; this.touchRole[id] = 'editor';
        return;
      }
    }
    // editor widgets (sliders/buttons) — hit-test UI's own arrays directly,
    // avoiding UI.onMouseDown (which would fall through to container-slot logic)
    UI.mx = x / UI.scale; UI.my = y / UI.scale;
    for (const sdr of UI.sliders) {
      if (UI.mx >= sdr.x && UI.mx < sdr.x + sdr.w && UI.my >= sdr.y && UI.my < sdr.y + 20) {
        UI.dragSlider = sdr; UI.mouseDown = true; UI.updateSlider(); this.touchRole[id] = 'menu'; return;
      }
    }
    for (const b of UI.buttons) {
      if (UI.mx >= b.x && UI.mx < b.x + b.w && UI.my >= b.y && UI.my < b.y + b.h) {
        if (typeof Sfx !== 'undefined') Sfx.play('click');
        this.game.onButton(b.id); return;
      }
    }
  },
  editorMove(id, x, y) {
    if (this.dragId !== id || !this.dragCtrl) return;
    const l = this.layout.controls[this.dragCtrl];
    l.nx = clamp(x / this.cw(), 0.03, 0.97);
    l.ny = clamp(y / this.ch(), 0.05, 0.95);
  },
  editorLabel(idc, c) {
    const t = idc.toUpperCase();
    const sc = UI.scale;
    Font.draw(UI.ctx, t, c.x - Font.width(t) * sc / 2, c.y + c.r + 2 * sc, '#ffffff', sc, true);
  },
  drawEditor() {
    const ctx = UI.ctx, W = UI.W(), H = UI.H();
    ctx.fillStyle = 'rgba(10,10,20,0.82)';
    ctx.fillRect(0, 0, this.cw(), this.ch());
    UI.textC('Edit Touch Controls', W / 2, 8, '#ffffff');
    UI.textC('Drag any button to move it', W / 2, 20, '#c8c8c8');
    // draw all controls (all visible, incl. creative ones so they can be placed)
    for (const idc of this.order()) {
      const c = this.cpos(idc);
      const sel = this.dragCtrl === idc;
      const op = 0.9;
      if (idc === 'move') {
        this.circle(c.x, c.y, c.r, `rgba(0,0,0,${op * 0.35})`, sel ? '#ffe86b' : `rgba(255,255,255,0.6)`, (sel ? 3 : 2) * UI.scale);
        this.circle(c.x, c.y, c.r * 0.45, 'rgba(230,230,230,0.7)', 'rgba(255,255,255,0.9)', 2 * UI.scale);
      } else {
        this.circle(c.x, c.y, c.r, 'rgba(30,30,30,0.6)', sel ? '#ffe86b' : 'rgba(255,255,255,0.7)', (sel ? 3 : 2) * UI.scale);
        this.glyph(idc, c.x, c.y, c.r, '#ffffff');
      }
      this.editorLabel(idc, c);
    }
    // sliders + buttons (bottom bar) — use UI's own widgets so clicks reuse menu emul
    const o = this.layout;
    UI.slider('touch_op', W / 2 - 155, H - 44, 150, 'Opacity: ' + Math.round(o.opacity * 100) + '%', (o.opacity - 0.2) / 0.6);
    UI.slider('touch_size', W / 2 + 5, H - 44, 150, 'Button Size: ' + Math.round(o.size * 100) + '%', (o.size - 0.6) / 1.2);
    UI.button('touch_cross', W / 2 - 155, H - 20, 100, 'Crosshair: ' + (o.crosshair ? 'ON' : 'OFF'), true);
    UI.button('touch_reset', W / 2 - 50, H - 20, 100, 'Reset', true);
    UI.button('touch_done', W / 2 + 55, H - 20, 100, 'Done', true);
    this.drawCloseBtn();
  },
};

// ==== main.js ====
'use strict';
// ============ main.js — game orchestration ============

const SPLASHES = [
  'Also try Terraria!', 'Punch a tree!', '100% pure JavaScript!', 'Procedurally generated!',
  'Watch out for creepers!', 'Free the End!', 'Now with hunger!', 'Fully beatable!',
  'One file... well, sixteen!', 'No textures were downloaded!', 'Herobrine not included',
  'Diamonds are forever!', 'The cake is a lie!', 'Dig deep!', 'Beware of the night!',
];

const Game = {
  state: 'title', // title|create|loading|play|dead|win
  mode: 'survival', // survival|creative
  world: null, dims: {},
  player: null,
  seed: 0,
  time: 1000, dayLight: 1,
  tickAcc: 0, tickCount: 0,
  fps: 0, fpsAcc: 0, fpsN: 0, chunkUpdates: 0,
  splash: SPLASHES[(Math.random() * SPLASHES.length) | 0],
  options: { music: 0.5, sound: 0.8, sens: 0.5, fov: 0.2, render: 0.5, bob: true },
  pointerLocked: false,
  bossBar: null,
  portalCd: 0,
  dragonKilled: false, dragonSpawned: false,
  achievements: {},
  loadingProgress: 0, loadingTitle: '', loadingSub: '',
  creditsScroll: 0, creditsLines: [],
  saveTimer: 0,
  showDebug: false,
  loadQueue: null,
  pendingSave: null,
  // first-person bare-arm pose (live-tweakable via MC.game.armPose.* for tuning)
  armPose: { posX: 0.89, posY: -0.68, posZ: -0.78, rotZ: 1.35, rotY: -0.57, rotX: 1.39, scale: 0.82 },
  armThick: 5, // arm box width/depth in 1/16 units (vanilla default is 4); height stays 12

  // rebuilds the steve_arm box geometry at the current armThick and clears the cached
  // GPU mesh so the new thickness shows up immediately
  applyArmThick() {
    const t = this.armThick;
    const box = MOB_MODELS.steve_arm.boxes[0];
    box.size = [t, 12, t];
    box.off = [-t / 2 / 16, -12 / 16, -t / 2 / 16];
    box.uvSize = [4, 12, 4]; // keep sampling the original 4x12x4 skin region, just stretched
    if (Renderer.mobGeoCache) delete Renderer.mobGeoCache.steve_arm;
  },

  get renderDist() { return 4 + Math.round(this.options.render * 8); },
  get fov() { return 60 + this.options.fov * 50; },

  init() {
    Tex.init();
    Renderer.init();
    UI.init();
    this.loadOptions();
    this.bindInput();
    Mobile.init(this);
    // steve arm for first-person view
    MOB_MODELS.steve_arm = { tex: 'steve', boxes: [{ name: 'arm', uv: [40, 16], size: [4, 12, 4], off: [-2 / 16, -12 / 16, -2 / 16] }], pose() {} };
    this.applyArmThick();
    this.last = performance.now();
    requestAnimationFrame(() => this.loop());
  },
  loadOptions() {
    try {
      const o = JSON.parse(localStorage.getItem('mcjs_options'));
      if (o) Object.assign(this.options, o);
    } catch (e) {}
    Sfx.setVolumes(this.options.sound, this.options.music);
  },
  setOption(id, v) {
    if (id === 'touch_op') { Mobile.layout.opacity = 0.2 + v * 0.6; Mobile.save(); return; }
    if (id === 'touch_size') { Mobile.layout.size = 0.6 + v * 1.2; Mobile.save(); return; }
    if (id === 'bob') this.options.bob = !this.options.bob;
    else this.options[id] = v;
    Sfx.setVolumes(this.options.sound, this.options.music);
    try { localStorage.setItem('mcjs_options', JSON.stringify(this.options)); } catch (e) {}
  },

  // ---------- input ----------
  bindInput() {
    const cv = document.getElementById('ui');
    window.addEventListener('keydown', (e) => this.onKey(e, true));
    window.addEventListener('keyup', (e) => this.onKey(e, false));
    window.addEventListener('mousemove', (e) => {
      if (Mobile.enabled) return; // touch/pointer handled by Mobile
      UI.onMouseMove(e.clientX, e.clientY);
      if (this.pointerLocked && this.player && this.state === 'play' && UI.screen === 'none') {
        const sens = 0.0012 + this.options.sens * 0.0045;
        this.player.yaw += e.movementX * sens;
        this.player.pitch = clamp(this.player.pitch + e.movementY * sens, -Math.PI / 2 + 0.001, Math.PI / 2 - 0.001);
      }
    });
    window.addEventListener('mousedown', (e) => {
      if (Mobile.enabled) return; // touch/pointer handled by Mobile
      e.preventDefault();
      UI.mouseDown = true;
      Sfx.ensure();
      if (this.state === 'win') { this.skipCredits(); return; }
      if (UI.onMouseDown(e.button, e.shiftKey)) return;
      if (this.state !== 'play' || UI.screen !== 'none') return;
      if (Chat.open) return;
      if (!this.pointerLocked) { this.requestPointer(); return; }
      if (e.button === 0) { this.player.keys.attack = true; this.player.attackPress(); }
      else if (e.button === 2) { this.player.keys.use = true; this.player.usePress(); }
    });
    window.addEventListener('mouseup', (e) => {
      if (Mobile.enabled) return; // touch/pointer handled by Mobile
      UI.mouseDown = false;
      UI.onMouseUp();
      if (!this.player) return;
      if (e.button === 0) this.player.keys.attack = false;
      if (e.button === 2) this.player.keys.use = false;
    });
    window.addEventListener('contextmenu', (e) => e.preventDefault());
    window.addEventListener('wheel', (e) => {
      if (this.state === 'play' && UI.screen === 'creative') {
        const max = Math.max(0, Math.ceil((UI.creativeItems || []).length / 9) - 5);
        UI.creativeScroll = clamp((UI.creativeScroll || 0) + Math.sign(e.deltaY), 0, max);
        return;
      }
      if (this.state !== 'play' || UI.screen !== 'none' || !this.player) return;
      const d = Math.sign(e.deltaY);
      this.player.selected = (this.player.selected + d + 9) % 9;
      UI.showItemName(this.player.heldItem());
    }, { passive: true });
    document.addEventListener('pointerlockchange', () => {
      this.pointerLocked = document.pointerLockElement != null;
      if (!this.pointerLocked && this.state === 'play' && UI.screen === 'none' && !this._escClose) {
        UI.screen = 'pause';
      }
      this._escClose = false;
    });
  },
  requestPointer() {
    if (Mobile.enabled) return; // no pointer lock on touch devices
    const el = document.getElementById('ui');
    if (el.requestPointerLock) {
      const r = el.requestPointerLock({ unadjustedMovement: true });
      if (r && r.catch) r.catch(() => { try { el.requestPointerLock(); } catch (e) {} });
    }
  },
  releasePointer() {
    this._escClose = true;
    if (document.exitPointerLock) document.exitPointerLock();
  },
  onKey(e, down) {
    // when the mobile on-screen keyboard is active, its hidden <input> owns text entry
    if (Mobile.enabled && Mobile.kbTarget) return;
    const code = e.code;
    if (down && code === 'F11') { e.preventDefault(); this.toggleFullscreen(); return; }
    if (down && code === 'F3') { e.preventDefault(); this.showDebug = !this.showDebug; return; }
    if (this.state === 'create' && down) {
      const field = UI.createFocus === 'seed' ? 'seedInput' : 'nameInput';
      if (code === 'Tab') UI.createFocus = UI.createFocus === 'seed' ? 'name' : 'seed';
      else if (code === 'Backspace') UI[field] = UI[field].slice(0, -1);
      else if (code === 'Enter') this.onButton('create_go');
      else if (code === 'Escape') this.onButton('create_back');
      else if (e.key.length === 1 && UI[field].length < 24) UI[field] += e.key;
      e.preventDefault();
      return;
    }
    if (this.state === 'worlds' && down) {
      if (code === 'Escape') this.state = 'title';
      return;
    }
    if (!this.player) return;
    // chat captures all keys while open
    if (Chat.open) {
      if (down) Chat.onKey(e);
      e.preventDefault();
      return;
    }
    if (down && this.state === 'play' && UI.screen === 'none' && !e.repeat) {
      if (code === 'KeyT') { e.preventDefault(); Chat.openChat(''); return; }
      if (e.key === '/') { e.preventDefault(); Chat.openChat('/'); return; }
    }
    const K = this.player.keys;
    switch (code) {
      case 'KeyW': K.fwd = down; break;
      case 'KeyS': K.back = down; break;
      case 'KeyA': K.left = down; break;
      case 'KeyD': K.right = down; break;
      case 'Space': K.jump = down; if (down) e.preventDefault(); break;
      case 'ShiftLeft': case 'ShiftRight': K.sneak = down; break;
      case 'ControlLeft': case 'ControlRight': if (down) K.sprint = true; break;
    }
    // double-tap W to sprint; ignore auto-repeat so holding W just walks
    if (down && code === 'KeyW' && !e.repeat) {
      const now = performance.now();
      if (now - (this.player.doubleTapW || 0) < 300) K.sprint = true;
      this.player.doubleTapW = now;
    }
    if (!down && code === 'KeyW') K.sprint = false;
    // double-tap Space toggles flying in creative, like vanilla
    if (down && code === 'Space' && !e.repeat && this.mode === 'creative') {
      const now = performance.now();
      if (now - (this.player.doubleTapSpace || 0) < 300) {
        const p = this.player;
        p.fly = !p.fly;
        if (p.fly) { p.vy = Math.max(p.vy, 4); p.onGround = false; }
      }
      this.player.doubleTapSpace = now;
    }
    if (!down) return;
    if (code === 'Escape') {
      if (UI.screen !== 'none' && UI.screen !== 'pause' && UI.screen !== 'options' && UI.screen !== 'controls') { UI.closeScreen(); return; }
      if (UI.screen === 'options' || UI.screen === 'controls') { this.onButton('options_done'); return; }
      if (UI.screen === 'pause') { this.onButton('resume'); return; }
      return;
    }
    if (this.state !== 'play') return;
    if (code === 'KeyE') {
      if (UI.screen === 'none') UI.openInventory();
      else if (UI.screen !== 'pause' && UI.screen !== 'options') UI.closeScreen();
      this.achieve('inventory');
    }
    if (UI.screen !== 'none') return;
    if (code === 'KeyQ') this.player.dropSelected(e.ctrlKey);
    if (code.startsWith('Digit')) {
      const n = parseInt(code.slice(5));
      if (n >= 1 && n <= 9) {
        this.player.selected = n - 1;
        UI.showItemName(this.player.heldItem());
      }
    }
  },
  toggleFullscreen() {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen();
  },
  onButton(id) {
    if (id.startsWith && id.startsWith('wsel_')) {
      const wid = +id.slice(5);
      if (UI.selectedWorld === wid) this.loadGame(wid); // second click plays
      else UI.selectedWorld = wid;
      return;
    }
    switch (id) {
      case 'single': this.state = 'worlds'; UI.selectedWorld = null; break;
      case 'worlds_play': if (UI.selectedWorld != null) this.loadGame(UI.selectedWorld); break;
      case 'worlds_create': this.state = 'create'; UI.seedInput = ''; UI.nameInput = ''; UI.createFocus = 'name'; UI.createMode = 'survival'; break;
      case 'worlds_delete': if (UI.selectedWorld != null) { this.deleteWorld(UI.selectedWorld); UI.selectedWorld = null; } break;
      case 'worlds_back': this.state = 'title'; break;
      case 'focus_name': UI.createFocus = 'name'; break;
      case 'focus_seed': UI.createFocus = 'seed'; break;
      case 'create_go': this.newWorld(UI.seedInput, UI.nameInput, UI.createMode); break;
      case 'create_back': this.state = 'worlds'; break;
      case 'create_mode': UI.createMode = UI.createMode === 'creative' ? 'survival' : 'creative'; break;
      case 'options_title': UI.optionsBack = 'title'; UI.screen = 'options'; this.state = 'title_options'; break;
      case 'resume': UI.screen = 'none'; this.requestPointer(); break;
      case 'options': UI.optionsBack = 'pause'; UI.screen = 'options'; break;
      case 'controls': UI.screen = 'controls'; break;
      case 'controls_done': UI.screen = this.state === 'play' ? 'pause' : 'none'; break;
      case 'options_done':
        if (UI.optionsBack === 'title') { UI.screen = 'none'; this.state = 'title'; }
        else UI.screen = 'pause';
        break;
      case 'bob': this.setOption('bob'); break;
      case 'touch_toggle': Mobile.setEnabled(!Mobile.enabled); break;
      case 'touch_edit': UI.screen = 'touchedit'; break;
      case 'touch_done': UI.screen = 'options'; break;
      case 'touch_reset': Mobile.resetLayout(); break;
      case 'touch_cross': Mobile.layout.crosshair = !Mobile.layout.crosshair; Mobile.save(); break;
      case 'quit': this.saveGame(); this.toTitle(); break;
      case 'quit_dead': this.toTitle(); break;
      case 'respawn': this.respawn(); break;
      case 'credits_done': this.endCredits(); break;
    }
  },
  toTitle() {
    UI.screen = 'none';
    Chat.open = false;
    Chat.input = '';
    this.state = 'title';
    this.world = null; this.dims = {}; this.player = null;
    this.bossBar = null;
    Particles.clear();
    Weather.reset();
    Music.stop();
    this.releasePointer();
  },

  // ---------- world lifecycle ----------
  // multi-world index: 'mcjs_worlds' → [{id,name,seed,created,played}], saves at 'mcjs_save_<id>'
  worldsIndex() {
    let idx = [];
    try { idx = JSON.parse(localStorage.getItem('mcjs_worlds')) || []; } catch (e) {}
    // migrate the legacy single-slot save into the list
    try {
      const legacy = localStorage.getItem('mcjs_save');
      if (legacy) {
        const id = idx.reduce((m, w) => Math.max(m, w.id), 0) + 1;
        localStorage.setItem('mcjs_save_' + id, legacy);
        const save = JSON.parse(legacy);
        idx.push({ id, name: 'World ' + id, seed: save.seed, created: Date.now(), played: Date.now() });
        localStorage.removeItem('mcjs_save');
        localStorage.setItem('mcjs_worlds', JSON.stringify(idx));
      }
    } catch (e) {}
    return idx;
  },
  saveWorldsIndex(idx) { try { localStorage.setItem('mcjs_worlds', JSON.stringify(idx)); } catch (e) {} },
  deleteWorld(id) {
    try { localStorage.removeItem('mcjs_save_' + id); } catch (e) {}
    this.saveWorldsIndex(this.worldsIndex().filter(w => w.id !== id));
  },
  hasSave() { return this.worldsIndex().length > 0; },
  newWorld(seedStr, name, mode) {
    let seed;
    if (seedStr && seedStr.trim()) {
      const n = parseInt(seedStr.trim());
      seed = isNaN(n) ? xmur3(seedStr.trim())() : (n >>> 0);
    } else seed = (Math.random() * 0xFFFFFFFF) >>> 0;
    this.mode = mode === 'creative' ? 'creative' : 'survival';
    const idx = this.worldsIndex();
    const id = idx.reduce((m, w) => Math.max(m, w.id), 0) + 1;
    idx.push({ id, name: (name && name.trim()) || 'World ' + id, seed, mode: this.mode, created: Date.now(), played: Date.now() });
    this.saveWorldsIndex(idx);
    this.currentWorldId = id;
    this.startWorld(seed, null);
  },
  startWorld(seed, save) {
    this.seed = seed;
    Gen.init(seed);
    this.dims = {
      overworld: new World('overworld', seed),
      nether: new World('nether', seed),
      end: new World('end', seed),
    };
    this.dragonKilled = false; this.dragonSpawned = false;
    this.time = 1000;
    this.achievements = {};
    Weather.reset();
    this.player = new Player(this);
    if (save) {
      this.applySave(save);
    } else {
      this.world = this.dims.overworld;
      // find spawn
      let sx = 8, sz = 8;
      outer: for (let r = 0; r < 40; r++) {
        for (let a = 0; a < 12; a++) {
          const x = Math.round(Math.cos(a / 12 * Math.PI * 2) * r * 12), z = Math.round(Math.sin(a / 12 * Math.PI * 2) * r * 12);
          const b = Gen.biomeAt(x, z);
          const h = Gen.heightAt(x, z);
          if (b !== BIOMES.ocean && b !== BIOMES.river && h > SEA && h < 85) { sx = x; sz = z; break outer; }
        }
      }
      const sy = Gen.heightAt(sx, sz) + 1;
      this.player.x = sx + 0.5; this.player.y = sy + 0.5; this.player.z = sz + 0.5;
      this.player.spawnX = sx + 0.5; this.player.spawnY = sy + 1; this.player.spawnZ = sz + 0.5;
      this.player.fallStart = this.player.y;
    }
    // build load queue (spiral)
    this.state = 'loading';
    this.loadingTitle = 'Generating world';
    this.loadingSub = 'Building terrain';
    this.beginAreaLoad(4);
  },
  beginAreaLoad(radius) {
    const pcx = floor(this.player.x) >> 4, pcz = floor(this.player.z) >> 4;
    const q = [];
    for (let dx = -radius; dx <= radius; dx++) for (let dz = -radius; dz <= radius; dz++) q.push([pcx + dx, pcz + dz, dx * dx + dz * dz]);
    q.sort((a, b) => a[2] - b[2]);
    this.loadQueue = q;
    this.loadTotal = q.length;
  },
  updateLoading() {
    const t0 = performance.now();
    while (this.loadQueue.length && performance.now() - t0 < 30) {
      const [cx, cz] = this.loadQueue.shift();
      this.world.ensureChunk(cx, cz);
    }
    this.loadingProgress = 1 - this.loadQueue.length / this.loadTotal;
    if (!this.loadQueue.length) {
      // settle player on ground
      const p = this.player;
      for (let y = 126; y > 1; y--) {
        if (Blocks[this.world.getBlock(floor(p.x), y, floor(p.z))].solid) { p.y = Math.max(p.y, y + 1.01); break; }
      }
      // build initial meshes synchronously-ish
      Renderer.updateChunkMeshes(this.world, p.x, p.z, Math.min(4, this.renderDist));
      this.state = 'play';
      UI.screen = 'none';
      this.requestPointer();
      UI.msg('Welcome! Punch trees to gather wood.');
      Music.nextT = 5;
    }
  },

  // ---------- save / load ----------
  saveGame() {
    if (!this.player || this.state === 'title') return;
    try {
      const p = this.player;
      const dimSave = (w) => ({
        edits: [...w.edits.entries()],
        be: [...w.blockEntities.values()].map(be => {
          const o = { x: be.x, y: be.y, z: be.z, type: be.type };
          if (be.items) o.items = be.items;
          if (be.mob) o.mob = be.mob;
          if (be.burn) { o.burn = be.burn; o.burnMax = be.burnMax; o.cook = be.cook; }
          return o;
        }),
        spawned: [...w.spawnedChunks],
      });
      const save = {
        v: 1, seed: this.seed, time: this.time, dim: this.world.dim, mode: this.mode,
        weather: Weather.state, weatherTime: Weather.timer,
        dragonKilled: this.dragonKilled, dragonSpawned: this.dragonSpawned,
        achievements: this.achievements,
        player: {
          x: p.x, y: p.y, z: p.z, yaw: p.yaw, pitch: p.pitch,
          hp: p.hp, hunger: p.hunger, sat: p.saturation, xp: p.xp, lvl: p.xpLevel, prog: p.xpProgress,
          inv: p.inventory.slots, armor: p.inventory.armor, sel: p.selected,
          spawn: [p.spawnX, p.spawnY, p.spawnZ], bed: p.bedSpawn,
        },
        dims: { overworld: dimSave(this.dims.overworld), nether: dimSave(this.dims.nether), end: dimSave(this.dims.end) },
      };
      localStorage.setItem('mcjs_save_' + (this.currentWorldId || 0), JSON.stringify(save));
      const idx = this.worldsIndex();
      const w = idx.find(w => w.id === this.currentWorldId);
      if (w) { w.played = Date.now(); this.saveWorldsIndex(idx); }
    } catch (e) { UI.msg('Could not save world (storage full)'); }
  },
  loadGame(id) {
    let save;
    try { save = JSON.parse(localStorage.getItem('mcjs_save_' + id)); } catch (e) {}
    if (!save) { this.state = 'create'; return; }
    this.currentWorldId = id;
    this.startWorld(save.seed, save);
  },
  applySave(save) {
    this.time = save.time;
    this.mode = save.mode || 'survival';
    Weather.reset();
    if (save.weather) Weather.set(save.weather, save.weatherTime);
    this.dragonKilled = save.dragonKilled; this.dragonSpawned = save.dragonSpawned;
    this.achievements = save.achievements || {};
    for (const dim of ['overworld', 'nether', 'end']) {
      const w = this.dims[dim], d = save.dims[dim];
      if (!d) continue;
      w.edits = new Map(d.edits);
      for (const be of d.be) w.blockEntities.set(be.x + ',' + be.y + ',' + be.z, be);
      w.spawnedChunks = new Set(d.spawned);
    }
    this.world = this.dims[save.dim];
    const p = this.player, sp = save.player;
    p.x = sp.x; p.y = sp.y; p.z = sp.z; p.yaw = sp.yaw; p.pitch = sp.pitch;
    p.hp = sp.hp; p.hunger = sp.hunger; p.saturation = sp.sat;
    p.xp = sp.xp; p.xpLevel = sp.lvl; p.xpProgress = sp.prog;
    p.inventory.slots = sp.inv; p.inventory.armor = sp.armor; p.selected = sp.sel;
    p.spawnX = sp.spawn[0]; p.spawnY = sp.spawn[1]; p.spawnZ = sp.spawn[2];
    p.bedSpawn = sp.bed;
    p.fallStart = p.y;
  },

  // ---------- game events ----------
  achieve(id) {
    if (this.achievements[id]) return;
    const DEFS = {
      inventory: ['Taking Inventory', 'Press E to open your inventory', 'crafting_table'],
      getWood: ['Getting Wood', 'Punch a tree until a block pops out', 'log'],
      workbench: ['Benchmarking', 'Craft a crafting table', 'crafting_table'],
      wood_pick: ['Time to Mine!', 'Craft a wooden pickaxe', 'wooden_pickaxe'],
      stone: ['Stone Age', 'Mine stone with a pickaxe', 'cobblestone'],
      furnace: ['Hot Topic', 'Construct a furnace', 'furnace'],
      iron: ['Acquire Hardware', 'Smelt an iron ingot', 'iron_ingot'],
      diamonds: ['DIAMONDS!', 'Mine diamonds with an iron pickaxe', 'diamond'],
      portal: ['We Need to Go Deeper', 'Build a Nether portal', 'obsidian'],
      blaze: ['Into Fire', 'Relieve a Blaze of its rod', 'blaze_rod'],
      the_end_q: ['The End?', 'Follow an Eye of Ender', 'eye_of_ender'],
      the_end: ['The End.', 'Defeat the Ender Dragon', 'dragon_egg'],
      hunter: ['Monster Hunter', 'Attack and destroy a monster', 'iron_sword'],
      cow: ['Cow Tipper', 'Harvest some leather', 'leather'],
      bread: ['Bake Bread', 'Turn wheat into bread', 'bread'],
    };
    const d = DEFS[id];
    if (!d) return;
    this.achievements[id] = true;
    UI.toast('Achievement Get!', d[0], d[2]);
    UI.msg('Achievement Get! ' + d[0]);
  },
  onBlockMined(id, tool) {
    if (id === B.LOG || id === B.BIRCH_LOG || id === B.SPRUCE_LOG) this.achieve('getWood');
    if (id === B.STONE && tool && Items[tool.id] && Items[tool.id].toolType === 'pickaxe') this.achieve('stone');
    if (id === B.DIAMOND_ORE && tool && Items[tool.id] && Items[tool.id].toolTier >= 2) this.achieve('diamonds');
  },
  onBlockPlaced(id) {},
  onCraft(id) {
    if (id === 'crafting_table') this.achieve('workbench');
    if (id === 'wooden_pickaxe') this.achieve('wood_pick');
    if (id === 'furnace') this.achieve('furnace');
    if (id === 'bread') this.achieve('bread');
  },
  onMobKilled(type) {
    if (['zombie', 'skeleton', 'creeper', 'spider', 'enderman', 'blaze', 'ghast', 'pigman'].includes(type)) this.achieve('hunter');
    if (type === 'cow') this.achieve('cow');
    if (type === 'blaze') this.achieve('blaze');
  },
  onFurnaceTake(id) {
    if (id === 'iron_ingot') this.achieve('iron');
  },
  onPlayerDeath() {
    this.state = 'dead';
    Chat.open = false;
    this.releasePointer();
    UI.screen = 'none';
  },
  respawn() {
    // respawn in overworld
    if (this.world.dim !== 'overworld') this.world = this.dims.overworld;
    this.player.respawn();
    this.state = 'loading';
    this.loadingTitle = 'Respawning';
    this.loadingSub = '';
    this.beginAreaLoad(3);
  },
  trySleep(x, y, z) {
    const t = this.time % 24000;
    if (t < 12500 && t > 100) { UI.msg('You can only sleep at night'); return; }
    for (const e of this.world.entities) {
      if (e instanceof HostileMob && !e.dead && Math.hypot(e.x - x, e.y - y, e.z - z) < 9) {
        UI.msg('You may not rest now, there are monsters nearby');
        return;
      }
    }
    this.player.bedSpawn = { x: x + 0.5, y: y + 1, z: z + 0.5 };
    this.time = Math.ceil(this.time / 24000) * 24000 + 100;
    UI.msg('You slept through the night');
    Sfx.play('click');
  },

  // ---------- portals ----------
  travelNetherPortal() {
    const p = this.player;
    this.portalCd = 6;
    const fromNether = this.world.dim === 'nether';
    const target = fromNether ? this.dims.overworld : this.dims.nether;
    const tx = fromNether ? p.x * 8 : p.x / 8;
    const tz = fromNether ? p.z * 8 : p.z / 8;
    Sfx.play('portalTravel');
    this.switchDim(target, tx, p.y, tz, () => {
      const spot = Portals.findOrCreate(target, floor(tx), floor(tz));
      p.x = spot[0] + 0.5; p.y = spot[1]; p.z = spot[2] + 0.5;
      p.vx = p.vy = p.vz = 0;
      p.fallStart = p.y;
      if (!fromNether) UI.msg('Entering the Nether...');
    }, fromNether ? 'Returning to the Overworld' : 'Entering the Nether');
  },
  travelEndPortal() {
    const p = this.player;
    this.portalCd = 6;
    if (this.world.dim === 'end') {
      // exit portal → overworld spawn (+ credits first time)
      const justWon = this.dragonKilled && !this.creditsShown;
      this.switchDim(this.dims.overworld, p.spawnX, p.spawnY, p.spawnZ, () => {
        p.x = p.spawnX; p.y = p.spawnY + 1; p.z = p.spawnZ;
        p.vx = p.vy = p.vz = 0;
        p.fallStart = p.y;
        if (justWon) this.rollCredits();
      }, 'Returning home');
    } else {
      Sfx.play('portalTravel');
      this.switchDim(this.dims.end, 70, 49, 0, () => {
        p.x = 70.5; p.y = 49; p.z = 0.5;
        p.vx = p.vy = p.vz = 0;
        p.fallStart = p.y;
        // clear platform
        for (let dx = -2; dx <= 2; dx++) for (let dz = -2; dz <= 2; dz++) for (let dy = 0; dy <= 3; dy++) {
          if (this.dims.end.getBlock(70 + dx, 49 + dy, dz) !== B.AIR) this.dims.end.setBlock(70 + dx, 49 + dy, dz, B.AIR);
          this.dims.end.setBlock(70 + dx, 48, dz, B.OBSIDIAN);
        }
        if (!this.dragonKilled && !this.dims.end.entities.some(e => e.type === 'dragon')) {
          spawnMob(this.dims.end, 'dragon', 0, 90, 0);
        }
      }, 'Entering the End');
    }
  },
  switchDim(target, cx, cy, cz, andThen, title) {
    this.world = target;
    this.player.portalT = 0;
    this.state = 'loading';
    this.loadingTitle = title;
    this.loadingSub = '';
    // preload around target
    const pcx = floor(cx) >> 4, pcz = floor(cz) >> 4;
    const q = [];
    for (let dx = -3; dx <= 3; dx++) for (let dz = -3; dz <= 3; dz++) q.push([pcx + dx, pcz + dz, dx * dx + dz * dz]);
    q.sort((a, b) => a[2] - b[2]);
    this.loadQueue = q;
    this.loadTotal = q.length;
    this.player.x = cx; this.player.y = clamp(cy, 5, 120); this.player.z = cz;
    this._afterLoad = andThen;
    this.saveGame();
  },
  checkEndPortalComplete(fx, fy, fz) {
    // try ring centers near the placed frame
    const w = this.world;
    for (let cx = fx - 2; cx <= fx + 2; cx++) for (let cz = fz - 2; cz <= fz + 2; cz++) {
      let ok = true;
      for (let d = -1; d <= 1 && ok; d++) {
        for (const [x, z] of [[cx + d, cz - 2], [cx + d, cz + 2], [cx - 2, cz + d], [cx + 2, cz + d]]) {
          if (w.getBlock(x, fy, z) !== B.END_PORTAL_FRAME || !(w.getData(x, fy, z) & 8)) { ok = false; break; }
        }
      }
      if (ok) {
        for (let dx = -1; dx <= 1; dx++) for (let dz = -1; dz <= 1; dz++) {
          w.setBlock(cx + dx, fy, cz + dz, B.END_PORTAL);
        }
        Sfx.play('portalTravel', { vol: 1.4 });
        UI.msg('The portal awakens...');
        return;
      }
    }
  },
  onDragonKilled() {
    this.dragonKilled = true;
    this.bossBar = null;
    this.achieve('the_end');
    const w = this.dims.end;
    // activate exit portal
    for (const [x, y, z] of Gen.exitPortalBlocks()) w.setBlock(x, y, z, B.END_PORTAL);
    w.setBlock(0, 67, 0, B.DRAGON_EGG);
    UI.msg('The Ender Dragon has been defeated!');
    UI.msg('Enter the portal at the center island');
    this.saveGame();
  },
  rollCredits() {
    this.state = 'win';
    this.creditsShown = true;
    this.creditsScroll = 0;
    this.releasePointer();
    this.creditsLines = [
      ['', '#fff'],
      ['MINECRAFT JS', '#ffff55'], ['', '#fff'],
      ['You have reached the end', '#55ff55'],
      ['of this journey.', '#55ff55'], ['', '#fff'],
      ['The dragon is defeated.', '#ffffff'],
      ['The islands are quiet again.', '#ffffff'], ['', '#fff'],
      ['But the world remains -', '#aaaaaa'],
      ['every cave unexplored,', '#aaaaaa'],
      ['every mountain unclimbed,', '#aaaaaa'],
      ['every seed a new beginning.', '#aaaaaa'], ['', '#fff'],
      ['Thank you for playing.', '#ffff55'], ['', '#fff'], ['', '#fff'],
      ['A tribute to Minecraft', '#888888'],
      ['by Mojang / Markus Persson', '#888888'], ['', '#fff'],
      ['Recreated entirely in JavaScript', '#888888'],
      ['textures, sounds and music', '#888888'],
      ['generated procedurally', '#888888'], ['', '#fff'],
      ['Press the button to return', '#555555'],
    ];
    Music.stop();
    Music.nextT = 0.5;
  },
  skipCredits() { this.creditsScroll += 200; },
  endCredits() {
